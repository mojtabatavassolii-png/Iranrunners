const S={get:(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),id:()=>Date.now().toString(36)+Math.random().toString(36).slice(2)};
const C={bg:"#0d1117",bg2:"#161b22",bg3:"#21262d",card:"#1c2128",border:"rgba(255,255,255,0.08)",accent:"#c0392b",green:"#27ae60",warn:"#f39c12",danger:"#e74c3c",blue:"#2980b9",text:"#e6edf3",text2:"#8b949e",text3:"#484f58"};
const WT={interval:{label:"Interval",icon:"⚡",color:"#e74c3c",desc:"High-intensity repeats. Builds speed and VO₂max.",example:"e.g. 5×800m @ 3:50/km, 90s jog recovery"},easy:{label:"Easy Run",icon:"🟢",color:"#27ae60",desc:"Conversational pace. Builds aerobic base.",example:"e.g. 8km @ 5:30/km, Z2"},tempo:{label:"Tempo",icon:"🟠",color:"#f39c12",desc:"Comfortably hard at lactate threshold.",example:"e.g. 2km warm-up + 6km @ 4:30/km"},fartlek:{label:"Fartlek",icon:"🌈",color:"#9b59b6",desc:"Unstructured speed play based on feel.",example:"e.g. 8km: 1km easy, 2min hard, repeat"},longrun:{label:"Long Run",icon:"🔵",color:"#2980b9",desc:"Slow and steady. Cornerstone of endurance.",example:"e.g. 20km @ 5:45/km, Z2"},rest:{label:"Rest",icon:"😴",color:"#484f58",desc:"Full recovery. No running.",example:"Optional: 20min yoga"}};
const GR=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const IR=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"];

function secToTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?`${h}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`:`${m}:${String(sc).padStart(2,"0")}`;}
function paceToSec(p){const pts=String(p).split(":");return pts.length===2?parseInt(pts[0])*60+parseInt(pts[1]):parseFloat(p)*60;}
function secToPace(s){return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;}
function calcRec(r){let s=70;if(r.rhr>65)s-=15;if(r.motivation<=2)s-=10;if(r.sleepHrs<6&&r.sleepHrs>0)s-=15;if(r.pain==="Serious pain")s-=20;return Math.max(10,Math.min(100,s));}
function getWeeks(m,cal){const[y,mo]=m.split("-").map(Number);const first=new Date(y,mo-1,1),last=new Date(y,mo,0);const sd=cal==="persian"?6:1;const wks=[];let cur=new Date(first);while(cur.getDay()!==sd)cur.setDate(cur.getDate()-1);while(cur<=last){const end=new Date(cur);end.setDate(end.getDate()+6);wks.push({start:new Date(cur),end,label:cur.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+end.toLocaleDateString("en-GB",{day:"numeric",month:"short"})});cur.setDate(cur.getDate()+7);}return wks;}

function Inp({placeholder,type="text",value,onChange,min,max,step}){return <input type={type} placeholder={placeholder} value={value||""} min={min} max={max} step={step} onChange={onChange} style={{width:"100%",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:"11px 13px",fontSize:14,color:C.text,outline:"none",WebkitAppearance:"none"}}/>;}
function Fld({label,children}){return <div style={{marginBottom:14}}>{label&&<div style={{fontSize:12,color:C.text2,marginBottom:6,fontWeight:500}}>{label}</div>}{children}</div>;}
function Card({title,children,style={}}){return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:20,marginBottom:12,...style}}>{title&&<div style={{fontSize:14,fontWeight:700,marginBottom:16}}>{title}</div>}{children}</div>;}
function Btn({children,onClick,secondary,sm,color,full=true,loading}){return <button onClick={onClick} disabled={loading} style={{width:full?"100%":"auto",padding:sm?"8px 16px":"14px",borderRadius:sm?20:14,border:secondary?`1px solid ${C.border}`:"none",background:secondary?"transparent":color||C.accent,color:secondary?C.text2:"#fff",fontSize:sm?12:15,fontWeight:700,cursor:"pointer",marginTop:full&&!sm?12:0}}>{loading?"Saving...":children}</button>;}
function Tag({children,color=C.green}){return <span style={{fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:20,background:color+"22",color}}>{children}</span>;}
function Chips({options,value,onChange}){return <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{options.map(o=>{const label=typeof o==="string"?o:o.label;const color=typeof o==="object"&&o.color?o.color:C.accent;const sel=value===label;return <button key={label} onClick={()=>onChange(sel?"":label)} style={{padding:"7px 14px",borderRadius:20,fontSize:12,fontWeight:500,border:`1px solid ${sel?color:C.border}`,background:sel?color+"22":"rgba(255,255,255,.03)",color:sel?color:C.text2,cursor:"pointer"}}>{label}</button>;})}</div>;}
function Tabs({tabs,active,onChange}){return <div style={{display:"flex",gap:2,background:C.bg3,borderRadius:8,padding:3,marginBottom:14,overflowX:"auto"}}>{tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,padding:"8px 8px",fontSize:11,fontWeight:600,border:"none",background:active===t.id?C.card:"transparent",color:active===t.id?C.text:C.text3,cursor:"pointer",borderRadius:6,whiteSpace:"nowrap"}}>{t.label}</button>)}</div>;}

function WorkoutModal({day,existing,onSave,onClose}){
  const[type,setType]=useState(existing?.type||"easy");
  const[form,setForm]=useState(existing?.form||{});
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const wt=WT[type];
  return <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:300,display:"flex",alignItems:"flex-end"}}>
    <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:"16px 16px 0 0",width:"100%",maxHeight:"92vh",overflowY:"auto",padding:20}}>
      <div style={{width:32,height:3,background:C.border,borderRadius:2,margin:"0 auto 14px"}}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <b style={{fontSize:15}}>{day}</b>
        <button onClick={onClose} style={{background:C.bg3,border:"none",color:C.text2,width:28,height:28,borderRadius:"50%",cursor:"pointer"}}>✕</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
        {Object.entries(WT).map(([k,v])=><button key={k} onClick={()=>{setType(k);setForm({});}} style={{padding:"10px 4px",borderRadius:10,border:`2px solid ${type===k?v.color:C.border}`,background:type===k?v.color+"22":"transparent",color:type===k?v.color:C.text3,cursor:"pointer",fontSize:11,fontWeight:700,textAlign:"center"}}>
          <div style={{fontSize:20,marginBottom:3}}>{v.icon}</div>{v.label}
        </button>)}
      </div>
      <div style={{background:C.bg3,borderLeft:`3px solid ${wt.color}`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:wt.color,marginBottom:4}}>{wt.label}</div>
        <div style={{fontSize:12,color:C.text2,lineHeight:1.7,marginBottom:4}}>{wt.desc}</div>
        <div style={{fontSize:11,color:C.text3,fontStyle:"italic"}}>{wt.example}</div>
      </div>
      {type==="interval"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Sets"><Inp type="number" placeholder="4" value={form.sets} onChange={e=>sf("sets",e.target.value)}/></Fld>
          <Fld label="Reps"><Inp type="number" placeholder="1" value={form.reps} onChange={e=>sf("reps",e.target.value)}/></Fld>
          <Fld label="Distance per rep"><Inp placeholder="800m" value={form.dist} onChange={e=>sf("dist",e.target.value)}/></Fld>
          <Fld label="Target pace"><Inp placeholder="3:50/km" value={form.pace} onChange={e=>sf("pace",e.target.value)}/></Fld>
          <Fld label="Recovery time"><Inp placeholder="90sec" value={form.recTime} onChange={e=>sf("recTime",e.target.value)}/></Fld>
        </div>
        <Fld label="Recovery type"><Chips value={form.recType||""} onChange={v=>sf("recType",v)} options={["Jog","Walk","Rest"]}/></Fld>
        <Fld label="HR Zone"><Chips value={form.zone||""} onChange={v=>sf("zone",v)} options={["Z3","Z4","Z5"]}/></Fld>
        <Fld label="Warm-up"><Inp placeholder="e.g. 2km easy" value={form.warmup} onChange={e=>sf("warmup",e.target.value)}/></Fld>
      </>}
      {(type==="easy"||type==="longrun")&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Distance (km)"><Inp type="number" step="0.5" placeholder="10" value={form.dist} onChange={e=>sf("dist",e.target.value)}/></Fld>
          <Fld label="Target pace"><Inp placeholder="5:30/km" value={form.pace} onChange={e=>sf("pace",e.target.value)}/></Fld>
        </div>
        <Fld label="HR Zone"><Chips value={form.zone||""} onChange={v=>sf("zone",v)} options={["Z1","Z2","Z2-Z3"]}/></Fld>
        {type==="longrun"&&<Fld label="Nutrition"><Inp placeholder="e.g. gel every 45min" value={form.nutrition} onChange={e=>sf("nutrition",e.target.value)}/></Fld>}
      </>}
      {type==="tempo"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Distance (km)"><Inp type="number" step="0.5" placeholder="6" value={form.dist} onChange={e=>sf("dist",e.target.value)}/></Fld>
          <Fld label="Target pace"><Inp placeholder="4:30/km" value={form.pace} onChange={e=>sf("pace",e.target.value)}/></Fld>
        </div>
        <Fld label="Zone"><Chips value={form.zone||""} onChange={v=>sf("zone",v)} options={["Z3","Z3-Z4","Z4"]}/></Fld>
      </>}
      {type==="fartlek"&&<>
        <Fld label="Total distance (km)"><Inp type="number" step="0.5" placeholder="8" value={form.dist} onChange={e=>sf("dist",e.target.value)}/></Fld>
        <Fld label="Structure"><textarea value={form.structure||""} onChange={e=>sf("structure",e.target.value)} rows={3} placeholder="1km easy, 2min hard..." style={{width:"100%",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,outline:"none",resize:"none"}}/></Fld>
      </>}
      <Fld label="Notes"><textarea value={form.notes||""} onChange={e=>sf("notes",e.target.value)} rows={2} placeholder="Additional instructions..." style={{width:"100%",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,outline:"none",resize:"none"}}/></Fld>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.text2,fontSize:14,fontWeight:600,cursor:"pointer"}}>Cancel</button>
        <button onClick={()=>onSave({type,form,label:wt.label,icon:wt.icon,color:wt.color})} style={{flex:2,padding:12,borderRadius:10,border:"none",background:wt.color,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Save Workout</button>
      </div>
    </div>
  </div>;
}

function PlanBuilder({runners,editPlan,onSave,onCancel}){
  const today=new Date();
  const[calType,setCalType]=useState(editPlan?.calType||"gregorian");
  const[month,setMonth]=useState(editPlan?.month||(today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")));
  const[weekIdx,setWeekIdx]=useState(0);
  const[runner,setRunner]=useState(editPlan?.runner||"");
  const[intensity,setIntensity]=useState(editPlan?.intensity||"Base");
  const[workouts,setWorkouts]=useState(editPlan?.workouts||{});
  const[editDay,setEditDay]=useState(null);
  const[sendMode,setSendMode]=useState(editPlan?.sendMode||"immediate");
  const[preview,setPreview]=useState(false);
  const[saving,setSaving]=useState(false);
  const days=calType==="persian"?IR:GR;
  const weeks=month?getWeeks(month,calType):[];
  const curWeek=weeks[weekIdx]||weeks[0];
  const totalKm=Object.values(workouts).reduce((s,w)=>s+(w?parseFloat(w.form?.dist||0):0),0).toFixed(1);
  const genText=()=>days.map(d=>{const w=workouts[d];if(!w||w.type==="rest")return d+": Rest";let l=d+": "+w.label;if(w.form.sets)l+=" — "+w.form.sets+"×"+(w.form.reps||"")+" "+(w.form.dist||"");if(w.form.dist&&!w.form.sets)l+=" — "+w.form.dist+"km";if(w.form.pace)l+=" @ "+w.form.pace+"/km";if(w.form.zone)l+=" ["+w.form.zone+"]";if(w.form.notes)l+=" · "+w.form.notes;return l;}).join("\n");
  const save=()=>{if(!runner&&!editPlan){alert("Select athlete");return;}setSaving(true);const plan={id:editPlan?.id||S.id(),runner:editPlan?.runner||runner,calType,month,weekStart:curWeek?.start.toISOString().slice(0,10)||"",weekLabel:curWeek?.label||"",intensity,workouts,sendMode,text:genText(),createdAt:editPlan?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};const plans=S.get("ir_plans",[]);if(editPlan){const idx=plans.findIndex(p=>p.id===editPlan.id);if(idx>=0)plans[idx]=plan;else plans.unshift(plan);}else plans.unshift(plan);S.set("ir_plans",plans);setSaving(false);alert(editPlan?"Plan updated!":"Saved for "+runner+"!");onSave&&onSave();};
  return <div>
    <button onClick={onCancel} style={{background:"none",border:"none",color:C.accent,fontSize:13,cursor:"pointer",marginBottom:12,padding:0}}>← Back</button>
    {editPlan&&<div style={{background:"rgba(243,156,18,.1)",border:"1px solid rgba(243,156,18,.3)",borderRadius:10,padding:12,marginBottom:12,fontSize:13,color:C.warn}}>✏️ Editing plan for {editPlan.runner}</div>}
    <Card title={editPlan?"Edit Plan":"New Training Plan"}>
      {!editPlan&&<Fld label="Athlete"><select value={runner} onChange={e=>setRunner(e.target.value)} style={{width:"100%",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:"11px 13px",fontSize:14,color:C.text,outline:"none"}}><option value="">-- Select --</option>{runners.map(r=><option key={r} value={r}>{r}</option>)}</select></Fld>}
      <Fld label="Calendar">
        <div style={{display:"flex",gap:8}}>

function StrategyTab(){
  const[tab,setTab]=useState("race");
  const[dist,setDist]=useState("42.2");const[target,setTarget]=useState("");const[strategy,setStrategy]=useState("even");const[split,setSplit]=useState("5");
  const[paceIn,setPaceIn]=useState("");const[distFt,setDistFt]=useState("42.2");
  const[result,setResult]=useState(null);const[timeRes,setTimeRes]=useState(null);
  const calcRace=()=>{const d=parseFloat(dist),t=paceToSec(target);if(!d||!t)return;const avg=t/d,iv=parseFloat(split)||5;const splits=[];let km=0;while(km<d){const end=Math.min(km+iv,d),sd=end-km;let sp=avg;if(strategy==="negative")sp=km<d/2?avg*1.03:avg*0.97;else if(strategy==="positive")sp=km<d/2?avg*0.97:avg*1.03;else if(strategy==="fast-start")sp=km<5?avg*0.95:avg*1.01;splits.push({from:km,to:end,pace:sp,time:sp*sd});km=end;}setResult({splits,avg,total:t,dist:d});};
  return <div>
    <Tabs tabs={[{id:"race",label:"Race Strategy"},{id:"pace",label:"Pace → Time"},{id:"zones",label:"Zones"}]} active={tab} onChange={setTab}/>
    {tab==="race"&&<div>
      <Card title="Race Strategy Calculator">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Fld label="Distance (km)"><Inp type="number" step="0.1" placeholder="42.2" value={dist} onChange={e=>setDist(e.target.value)}/></Fld>
          <Fld label="Target time"><Inp placeholder="3:45:00" value={target} onChange={e=>setTarget(e.target.value)}/></Fld>
        </div>
        <Fld label="Strategy"><Chips value={strategy} onChange={setStrategy} options={["even","negative","positive","fast-start"]}/></Fld>
        <Fld label="Split every (km)"><Inp type="number" placeholder="5" value={split} onChange={e=>setSplit(e.target.value)}/></Fld>
        <Btn onClick={calcRace}>Calculate</Btn>
      </Card>
      {result&&<Card title="Split Plan">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4,marginBottom:8}}>{["From","To","Pace","Time"].map(h=><div key={h} style={{fontSize:10,fontWeight:700,color:C.text3}}>{h}</div>)}</div>
        {result.splits.map((s,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,color:C.text2}}>{s.from}km</div><div style={{fontSize:12,color:C.text2}}>{s.to.toFixed(1)}km</div>
          <div style={{fontSize:12,fontWeight:600,color:C.accent}}>{secToPace(s.pace)}/km</div><div style={{fontSize:12}}>{secToTime(Math.round(s.time))}</div>
        </div>)}
      </Card>}
    </div>}
    {tab==="pace"&&<Card title="Pace → Finish Time">
      <Fld label="Distance (km)"><Inp type="number" step="0.1" placeholder="42.2" value={distFt} onChange={e=>setDistFt(e.target.value)}/></Fld>
      <Fld label="Target pace (min:sec/km)"><Inp placeholder="5:20" value={paceIn} onChange={e=>setPaceIn(e.target.value)}/></Fld>
      <Btn onClick={()=>{const d=parseFloat(distFt),p=paceToSec(paceIn);if(d&&p)setTimeRes({time:secToTime(Math.round(p*d)),pace:secToPace(p),dist:d});}}>Calculate</Btn>
      {timeRes&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>{[{l:"Finish time",v:timeRes.time,c:C.accent},{l:"Pace",v:timeRes.pace+"/km"},{l:"Distance",v:timeRes.dist+"km"}].map(x=><div key={x.l} style={{background:C.bg3,borderRadius:8,padding:12}}><div style={{fontSize:10,color:C.text3,marginBottom:3}}>{x.l}</div><div style={{fontSize:16,fontWeight:700,color:x.c||C.text}}>{x.v}</div></div>)}</div>}
    </Card>}
    {tab==="zones"&&<Card title="Training Zones">
      <Fld label="Race pace (min:sec/km)"><Inp placeholder="5:20" value={paceIn} onChange={e=>setPaceIn(e.target.value)}/></Fld>
      <Btn onClick={()=>{const p=paceToSec(paceIn);if(p)setTimeRes({zones:[{n:"Z1 Recovery",r:"<65%",m:1.5,u:"Warm-up"},{n:"Z2 Easy",r:"65–75%",m:1.25,u:"Long runs"},{n:"Z3 Tempo",r:"75–85%",m:1.05,u:"Tempo runs"},{n:"Z4 Threshold",r:"85–92%",m:0.97,u:"LT intervals"},{n:"Z5 VO₂max",r:">92%",m:0.88,u:"Intervals"}]});}}>Calculate</Btn>
      {timeRes?.zones&&timeRes.zones.map((z,i)=><div key={i} style={{background:C.bg3,borderRadius:8,padding:12,marginTop:8}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><b style={{fontSize:13}}>{z.n}</b><b style={{fontSize:13,color:C.accent}}>{secToPace(paceToSec(paceIn)*z.m)}/km</b></div><div style={{fontSize:11,color:C.text3}}>{z.r} · {z.u}</div></div>)}
    </Card>}
  </div>;
}

                {r?<div style={{fontSize:12,color:C.text2,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.km||0}km · {r.sessions||0} sessions · {agoStr}</div>
                :<div style={{fontSize:12,color:C.text3,marginTop:2}}>Followed {follower?new Date(follower.joinedAt).toLocaleDateString():"recently"} · No reports yet</div>}
                {r&&<div style={{display:"flex",gap:4,marginTop:5,flexWrap:"wrap"}}>{r.alerts?.length?r.alerts.map(a=><Tag key={a} color={r.status==="danger"?C.danger:C.warn}>{a}</Tag>):<Tag color={C.green}>Healthy</Tag>}</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:dotCol}}/>
                {!r&&<div style={{fontSize:9,color:C.text3}}>New</div>}
              </div>
            </div>;
          })}
        </div>;
      })()}      {selRunner&&<div onClick={e=>e.target===e.currentTarget&&setSelRunner(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
        <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:"14px 14px 0 0",width:"100%",maxHeight:"90vh",overflowY:"auto",padding:20}}>
          <div style={{width:32,height:3,background:C.border,borderRadius:2,margin:"0 auto 16px"}}/>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
            <div style={{width:44,height:44,borderRadius:"50%",background:"rgba(8,145,178,.15)",color:"#0891b2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700}}>{selRunner.runner.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}</div>
            <div><div style={{fontSize:16,fontWeight:700}}>{selRunner.runner}</div><div style={{fontSize:12,color:C.text2}}>{new Date(selRunner.createdAt).toLocaleDateString()}</div></div>
            <button onClick={()=>setSelRunner(null)} style={{marginLeft:"auto",background:C.bg3,border:"none",color:C.text2,width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:14}}>✕</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {[{l:"Volume",v:(selRunner.km||"—")+"km",c:C.green},{l:"Sessions",v:selRunner.sessions||"—"},{l:"Long run",v:(selRunner.longRun||"—")+"km"},{l:"Resting HR",v:(selRunner.rhr||"—")+"bpm",c:selRunner.rhr>65?C.warn:null},{l:"Sleep",v:(selRunner.sleep||"—")+(selRunner.sleepHrs?" / "+selRunner.sleepHrs+"h":"")},{l:"Motivation",v:(selRunner.motivation||"—")+"/5",c:selRunner.motivation<=2?C.warn:null},{l:"Stress",v:selRunner.stress||"—"},{l:"Energy",v:selRunner.energy||"—"}].map(x=><div key={x.l} style={{background:C.bg3,borderRadius:8,padding:10}}><div style={{fontSize:10,color:C.text3,marginBottom:3}}>{x.l}</div><div style={{fontSize:14,fontWeight:700,color:x.c||C.text}}>{x.v}</div></div>)}
          </div>
          {selRunner.notes&&<div style={{marginBottom:12}}><div style={{fontSize:10,fontWeight:700,color:C.text3,textTransform:"uppercase",marginBottom:6}}>Notes</div><div style={{fontSize:13,color:C.text2,background:C.bg3,borderRadius:8,padding:12,lineHeight:1.7}}>{selRunner.notes}</div></div>}
          <div style={{fontSize:10,fontWeight:700,color:C.text3,textTransform:"uppercase",marginBottom:8}}>Chat with {selRunner.runner}</div>
          <CoachChatBox runner={selRunner.runner}/>
        </div>
      </div>}
    </div>}
    {tab==="plans"&&<div>
      {planView==="list"&&<div>
        <button onClick={()=>{setEditPlan(null);setPlanView("new");}} style={{width:"100%",padding:14,borderRadius:12,border:`2px dashed ${C.accent}`,background:"rgba(192,57,43,.05)",color:C.accent,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:14}}>+ Create New Training Plan</button>
        {plans.length===0?<div style={{textAlign:"center",padding:40,color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>📅</div><p style={{fontSize:13}}>No plans yet.</p></div>:
        plans.map(p=><div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div><div style={{fontSize:14,fontWeight:700}}>{p.runner}</div><div style={{fontSize:11,color:C.text3,marginTop:2}}>{p.weekLabel||p.weekStart||"No date"} · {p.intensity}</div></div>
            <button onClick={()=>{setEditPlan(p);setPlanView("edit");}} style={{padding:"6px 12px",borderRadius:20,border:`1px solid ${C.warn}`,background:"rgba(243,156,18,.1)",color:C.warn,fontSize:11,fontWeight:600,cursor:"pointer"}}>✏️ Edit</button>
          </div>
          <pre style={{fontSize:12,color:C.text2,lineHeight:1.8,whiteSpace:"pre-wrap",fontFamily:"monospace",background:C.bg3,borderRadius:8,padding:8,maxHeight:72,overflow:"hidden"}}>{(p.text||"").slice(0,180)}{p.text?.length>180?"...":""}</pre>
        </div>)}
      </div>}
      {(planView==="new"||planView==="edit")&&<PlanBuilder runners={allRunners} editPlan={planView==="edit"?editPlan:null} onSave={()=>{reload();setPlanView("list");}} onCancel={()=>setPlanView("list")}/>}
    </div>}
    {tab==="feedback"&&<div>
      {plans.length===0?<div style={{textAlign:"center",padding:40,color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>💬</div><p style={{fontSize:13}}>No plans yet.</p></div>:
      plans.map(p=>{const pFbs=Object.entries(feedbacks).filter(([k])=>k.startsWith(p.id+"_")).map(([k,v])=>({day:k.slice(p.id.length+1),fb:v}));
      return <div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:14,marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{p.runner}</div>
        <div style={{fontSize:11,color:C.text3,marginBottom:10}}>{p.weekLabel||p.weekStart}</div>
        {pFbs.length===0?<div style={{fontSize:12,color:C.text3,fontStyle:"italic"}}>No feedback yet.</div>:
        pFbs.map(({day,fb})=><div key={day} style={{background:C.bg3,borderRadius:8,padding:10,marginBottom:6}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <b style={{fontSize:13}}>{day}</b>
            <div style={{display:"flex",gap:4}}>{fb.done===true&&<Tag color={C.green}>✅ Done</Tag>}{fb.done===false&&<Tag color={C.danger}>❌</Tag>}{fb.feel&&<Tag color={C.blue}>{fb.feel}</Tag>}</div>
          </div>
          <div style={{fontSize:12,color:C.text2,lineHeight:1.6}}>{fb.dist&&<span>📏 {fb.dist}km  </span>}{fb.pace&&<span>⏱ {fb.pace}/km  </span>}{fb.rpe&&<span>💪 RPE {fb.rpe}</span>}</div>
          {fb.notes&&<div style={{fontSize:12,color:C.text3,marginTop:4,fontStyle:"italic"}}>{fb.notes}</div>}
        </div>)}
      </div>;})}
    </div>}
    {tab==="alerts"&&<div>
      {runners.filter(r=>r.status!=="ok").length===0?<div style={{textAlign:"center",padding:40,color:C.text3}}><div style={{fontSize:32,marginBottom:8}}>✅</div><p style={{fontSize:13}}>No active alerts!</p></div>:
      runners.filter(r=>r.status!=="ok").map(r=><div key={r.runner} style={{background:r.status==="danger"?"rgba(231,76,60,.1)":"rgba(243,156,18,.1)",border:`1px solid ${r.status==="danger"?"rgba(231,76,60,.3)":"rgba(243,156,18,.3)"}`,borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:13,color:r.status==="danger"?C.danger:C.warn}}><strong>{r.runner}</strong> — {(r.alerts||[]).join(", ")}<div style={{fontSize:11,marginTop:4,opacity:.7}}>{new Date(r.createdAt).toLocaleDateString()}</div></div>)}
    </div>}

    {tab==="myprofile"&&<CoachProfileTab/>}
  </div>;
}

function App(){
  const[page,setPage]=useState("home");
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("ir_user"));}catch(e){return null;}});
  useEffect(()=>{if(user)setPage(user.role);},[]);
  const loginAs=role=>{const u=role==="coach"?{id:"coach-1",name:"IranRunners Coach",role:"coach"}:{id:"runner-1",name:"Ali Rezaei",role:"runner"};localStorage.setItem("ir_user",JSON.stringify(u));setUser(u);setPage(role);};
  const logout=()=>{localStorage.removeItem("ir_user");setUser(null);setPage("home");};
  if(!user)return <div style={{background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"system-ui,-apple-system,Arial,sans-serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 20px",textAlign:"center"}}>
    <img src={`data:image/png;base64,${LOGO}`} style={{height:52,marginBottom:28}} alt=""/>
    <div style={{fontSize:24,fontWeight:700,marginBottom:8,color:C.text}}>IranRunners</div>
    <div style={{fontSize:14,color:C.text2,marginBottom:40,maxWidth:280,lineHeight:1.6}}>Track your training, stay connected with your coach.</div>
    <div style={{width:"100%",maxWidth:300,display:"flex",flexDirection:"column",gap:12}}>
      <button onClick={()=>loginAs("runner")} style={{width:"100%",padding:16,borderRadius:14,border:"none",background:C.accent,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><span style={{fontSize:24}}>🏃</span> Continue as Runner</button>
      <button onClick={()=>loginAs("coach")} style={{width:"100%",padding:16,borderRadius:14,border:`1px solid ${C.border}`,background:"transparent",color:C.text,fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><span style={{fontSize:24}}>📋</span> Continue as Coach</button>
    </div>
  </div>;
  return <div style={{background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"system-ui,-apple-system,Arial,sans-serif"}}>
    <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(13,17,23,.96)",backdropFilter:"blur(16px)",borderBottom:`1px solid ${C.border}`,padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54}}>
      <img src={`data:image/png;base64,${LOGO}`} style={{height:32,objectFit:"contain"}} alt=""/>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:12,color:C.text3}}>{user.name.split(" ")[0]}</span>
        <button onClick={logout} style={{background:"none",border:`1px solid ${C.border}`,color:C.text3,padding:"4px 8px",borderRadius:20,fontSize:11,cursor:"pointer"}}>Logout</button>
      </div>
    </nav>
    <div style={{padding:16,paddingBottom:90}}>
      {page==="runner"&&<RunnerDashboard user={user}/>}
      {page==="coach"&&<CoachPanel/>}
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:"rgba(13,17,23,.96)",backdropFilter:"blur(16px)",borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:"calc(8px + env(safe-area-inset-bottom))",paddingTop:8,zIndex:100}}>
      {[{id:"runner",icon:"🏃",label:"Runner"},{id:"coach",icon:"📋",label:"Coach"}].map(b=><button key={b.id} onClick={()=>loginAs(b.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:6,color:page===b.id?C.accent:C.text3,fontSize:10,fontWeight:500}}><span style={{fontSize:20}}>{b.icon}</span><span>{b.label}</span></button>)}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
