<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IranRunners">
<meta name="theme-color" content="#0d1117">
<title>IranRunners</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
input,textarea,select,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* LAYOUT */
.nav{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px}
.nav-logo{height:32px;object-fit:contain}
.nav-right{display:flex;align-items:center;gap:8px;font-size:12px;color:#484f58}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.08);color:#484f58;padding:4px 8px;border-radius:20px;font-size:11px;cursor:pointer}
.page{display:none;padding:16px;padding-bottom:90px}
.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(13,17,23,.96);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:100}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px;color:#484f58;font-size:10px;font-weight:500}
.bnav-btn.active{color:#c0392b}
.bnav-icon{font-size:20px}
.max-wrap{max-width:480px;margin:0 auto}

/* CARDS */
.card{background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px}
.section-label{font-size:10px;font-weight:700;color:#484f58;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 10px}

/* FIELDS */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#8b949e;margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:11px 13px;font-size:14px;color:#e6edf3;outline:none;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:#c0392b}
.field textarea{resize:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:#c0392b;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn:active{opacity:.85}
.btn.secondary{background:transparent;border:1px solid rgba(255,255,255,.08);color:#8b949e}
.btn.sm{width:auto;padding:8px 16px;border-radius:20px;font-size:12px;margin-top:0}
.btn.warn{background:#f39c12}
.btn.green{background:#27ae60}
.back-btn{background:none;border:none;color:#c0392b;font-size:13px;cursor:pointer;margin-bottom:12px;padding:0}

/* CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8b949e;cursor:pointer}
.chip.active{background:rgba(192,57,43,.2);border-color:#c0392b;color:#c0392b}
.chip.warn-active{background:rgba(243,156,18,.2);border-color:#f39c12;color:#f39c12}
.chip.danger-active{background:rgba(231,76,60,.2);border-color:#e74c3c;color:#e74c3c}
.chip.green-active{background:rgba(39,174,96,.2);border-color:#27ae60;color:#27ae60}

/* TABS */
.tab-bar{display:flex;gap:2px;background:#21262d;border-radius:8px;padding:3px;margin-bottom:14px;overflow-x:auto}
.tab-btn{flex:1;padding:8px 10px;font-size:11px;font-weight:600;border:none;background:transparent;color:#484f58;cursor:pointer;border-radius:6px;white-space:nowrap;min-width:60px}
.tab-btn.active{background:#1c2128;color:#e6edf3}
.tab-content{display:none}
.tab-content.active{display:block}

/* TAGS */
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.tag-ok{background:rgba(39,174,96,.15);color:#27ae60}
.tag-warn{background:rgba(243,156,18,.15);color:#f39c12}
.tag-danger{background:rgba(231,76,60,.15);color:#e74c3c}
.tag-blue{background:rgba(41,128,185,.15);color:#2980b9}

/* PROFILE HERO */
.hero{background:linear-gradient(135deg,#1a1a2e,#0d1117);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero-avatar{width:56px;height:56px;border-radius:50%;background:rgba(192,57,43,.15);border:2px solid #c0392b;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#c0392b;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat-box{background:rgba(255,255,255,.04);border-radius:8px;padding:10px;text-align:center}
.stat-val{font-size:18px;font-weight:700;color:#c0392b}
.stat-lbl{font-size:10px;color:#484f58;margin-top:2px}

/* RUNNER CARDS */
.runner-card{background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:14px 14px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-handle{width:32px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin:0 auto 16px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.detail-item{background:#21262d;border-radius:8px;padding:10px}
.detail-label{font-size:10px;color:#484f58;margin-bottom:3px}
.detail-val{font-size:14px;font-weight:700}

/* WORKOUT DAY */
.day-card{background:#1c2128;border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.08)}
.day-card.has-workout{border-color:rgba(192,57,43,.3)}
.day-header{display:flex;justify-content:space-between;align-items:center}
.day-name{font-size:13px;font-weight:700;color:#484f58}
.day-workout-info{font-size:12px;color:#8b949e;margin-top:6px;background:#21262d;border-radius:8px;padding:8px;line-height:1.8}

/* WORKOUT TYPE GRID */
.wt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.wt-btn{padding:10px 4px;border-radius:10px;border:2px solid rgba(255,255,255,.08);background:transparent;cursor:pointer;font-size:11px;font-weight:700;text-align:center;color:#484f58}
.wt-btn.active{color:var(--wt-color)}

/* WEEK SELECTOR */
.week-btn{width:100%;padding:10px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#8b949e;font-size:13px;font-weight:600;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.week-btn.active{border-color:#c0392b;color:#c0392b;background:rgba(192,57,43,.08)}

/* FEEDBACK */
.fb-section{border-top:1px solid rgba(255,255,255,.08);padding-top:10px;margin-top:4px}
.fb-saved{font-size:11px;color:#27ae60;text-align:center;margin-top:6px}

/* RANGE SLIDER */
input[type=range]{width:100%;accent-color:#c0392b}

/* LOCK */
.lock-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.lock-input{width:100%;max-width:240px;background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px;font-size:20px;color:#e6edf3;outline:none;text-align:center;letter-spacing:8px;margin-bottom:12px}
.lock-input:focus{border-color:#c0392b}
.lock-err{font-size:13px;color:#e74c3c;margin-top:8px;min-height:18px}

/* HOME */
.home-screen{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.home-logo{height:52px;margin-bottom:28px}
.home-title{font-size:24px;font-weight:700;margin-bottom:8px}
.home-sub{font-size:14px;color:#8b949e;margin-bottom:40px;max-width:280px;line-height:1.6}
.role-btn{width:100%;max-width:300px;padding:16px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.role-btn.runner{border:none;background:#c0392b;color:#fff}
.role-btn.coach{border:1px solid rgba(255,255,255,.08);background:transparent;color:#e6edf3}

/* PLAN PREVIEW */
.plan-text{font-size:12px;color:#8b949e;line-height:1.9;white-space:pre-wrap;font-family:monospace;background:#1c2128;border-radius:8px;padding:12px}
.plan-card{background:#1c2128;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:10px}
.send-btn{display:flex;gap:8px;margin-top:8px}
.send-option{flex:1;padding:10px 6px;border-radius:10px;border:2px solid rgba(255,255,255,.08);background:transparent;color:#8b949e;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.send-option.active{border-color:#c0392b;color:#c0392b;background:rgba(192,57,43,.08)}

/* STRATEGY */
.split-table{width:100%}
.split-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.split-head{font-size:10px;font-weight:700;color:#484f58}
.zone-card{background:#21262d;border-radius:8px;padding:12px;margin-top:8px}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:#484f58}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}

/* ALERT BOXES */
.alert-box{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#e74c3c}
.warn-box{background:rgba(243,156,18,.1);border:1px solid rgba(243,156,18,.3);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#f39c12}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow-y:auto;margin-bottom:10px}
.msg{max-width:80%;padding:9px 13px;font-size:13px;line-height:1.5;color:#fff}
.msg.coach{background:#c0392b;border-radius:4px 13px 13px 13px;align-self:flex-start}
.msg.runner{background:#21262d;border-radius:13px 4px 13px 13px;align-self:flex-end}
.chat-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;font-size:13px;color:#e6edf3;outline:none;resize:none}
.chat-send{width:40px;height:40px;border-radius:50%;background:#c0392b;border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}

/* WORKOUT DESCRIPTION */
.wt-desc{background:#21262d;border-radius:10px;padding:12px;margin-bottom:12px;border-left:3px solid var(--wt-color,#c0392b)}
.wt-desc-title{font-size:12px;font-weight:700;color:var(--wt-color,#c0392b);margin-bottom:4px}
.wt-desc-text{font-size:12px;color:#8b949e;line-height:1.7;margin-bottom:4px}
.wt-desc-example{font-size:11px;color:#484f58;font-style:italic}

/* STATS CHART */
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:80px;padding:4px 0}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart-bar{width:100%;background:#c0392b;border-radius:3px 3px 0 0}
.chart-label{font-size:9px;color:#484f58}

/* PROGRESS BAR */
.prog-wrap{margin-bottom:10px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog-bar{height:5px;background:#21262d;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}
</style>
</head>

<script>
// ── STORE ──
var S={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){localStorage.setItem(k,JSON.stringify(v));},
  id:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
};

// ── STATE ──
var currentUser=S.get('ir_user',null);
var coachUnlocked=false;
var currentPlanBuild={calType:'gregorian',month:'',weekIdx:0,workouts:{},runner:'',intensity:'Base',sendMode:'immediate'};
var editingPlanId=null;
var editingDay=null;

// ── WORKOUT TYPES ──
var WT={
  interval:{label:'Interval',icon:'⚡',color:'#e74c3c',desc:'High-intensity repeats with recovery. Builds speed and VO₂max.',example:'e.g. 5×800m @ 3:50/km, 90s jog recovery + 2km warm-up'},
  easy:{label:'Easy Run',icon:'🟢',color:'#27ae60',desc:'Conversational pace. Builds aerobic base. You can hold a full conversation.',example:'e.g. 8km @ 5:30/km, Z2, stay below 75% max HR'},
  tempo:{label:'Tempo',icon:'🟠',color:'#f39c12',desc:'Comfortably hard at lactate threshold. Short sentences only.',example:'e.g. 2km warm-up + 6km @ 4:30/km + 1km cool-down'},
  fartlek:{label:'Fartlek',icon:'🌈',color:'#9b59b6',desc:'Unstructured speed play. Mix easy and fast efforts based on feel.',example:'e.g. 8km total: 1km easy, 2min hard, 1min easy — repeat'},
  longrun:{label:'Long Run',icon:'🔵',color:'#2980b9',desc:'Slow and steady. Cornerstone of endurance. Fat adaptation.',example:'e.g. 20km @ 5:45/km, Z2, gels after km 15'},
  rest:{label:'Rest',icon:'😴',color:'#484f58',desc:'Full recovery. No running. Light stretching is fine.',example:'Optional: 20min yoga or foam rolling'}
};
var GR_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var IR_DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];

// ── UTILS ──
function el(id){return document.getElementById(id);}
function html(id,h){el(id).innerHTML=h;}
function secToTime(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?h+':'+pad(m)+':'+pad(sc):m+':'+pad(sc);}
function pad(n){return String(n).padStart(2,'0');}
function paceToSec(p){var pts=String(p).split(':');return pts.length===2?parseInt(pts[0])*60+parseInt(pts[1]):parseFloat(p)*60;}
function secToPace(s){var m=Math.floor(s/60),sc=Math.round(s%60);return m+':'+pad(sc);}
function calcRec(r){var s=70;if(r.rhr>65)s-=15;if(r.motivation<=2)s-=10;if(r.sleepHrs<6&&r.sleepHrs>0)s-=15;if(r.pain==='Serious pain')s-=20;if(r.recovery==='Fast')s+=15;return Math.max(10,Math.min(100,s));}
function getWeeks(monthStr,cal){
  var parts=monthStr.split('-'),y=parseInt(parts[0]),m=parseInt(parts[1]);
  var first=new Date(y,m-1,1),last=new Date(y,m,0);
  var startDow=cal==='persian'?6:1;
  var weeks=[],cur=new Date(first);
  while(cur.getDay()!==startDow)cur.setDate(cur.getDate()-1);
  while(cur<=last){
    var end=new Date(cur);end.setDate(end.getDate()+6);
    weeks.push({start:new Date(cur),end:end,label:cur.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})});
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
function chipHtml(groupId,options,selected,cls){
  return options.map(function(o){
    var label=typeof o==='string'?o:o.label;
    var color=typeof o==='object'&&o.color?o.color:'#c0392b';
    var isSel=selected===label;
    var activeCls=color==='#f39c12'?'warn-active':color==='#e74c3c'?'danger-active':color==='#27ae60'?'green-active':'active';
    return '<button class="chip'+(isSel?' '+activeCls:'')+'" style="'+(isSel?'border-color:'+color+';color:'+color+';background:'+color+'22':'')+'" onclick="selectChip(''+groupId+'',''+label+'',''+color+'')">'+label+'</button>';
  }).join('');
}
function selectChip(groupId,val,color){
  // Update chips UI
  var group=document.querySelectorAll('[data-group="'+groupId+'"]');
  group.forEach(function(c){c.className='chip';c.style='';});
  // Find and activate
  group.forEach(function(c){
    if(c.textContent===val){
      var cls=color==='#f39c12'?'warn-active':color==='#e74c3c'?'danger-active':color==='#27ae60'?'green-active':'active';
      c.className='chip '+cls;
      c.style='border-color:'+color+';color:'+color+';background:'+color+'22';
    }
  });
  window['_chip_'+groupId]=val;
}
function getChip(groupId){return window['_chip_'+groupId]||'';}
function setChip(groupId,val){window['_chip_'+groupId]=val;}

// ── AUTH ──
function loginAs(role){
  var u=role==='coach'?{id:'coach-1',name:'IranRunners Coach',role:'coach'}:{id:'runner-1',name:'Ali Rezaei',role:'runner'};
  S.set('ir_user',u);currentUser=u;
  el('nav-username').textContent=u.name.split(' ')[0];
  showPage(role);
}
function logout(){S.set('ir_user',null);currentUser=null;showPage('home');}

// ── PAGE SWITCHING ──
function showPage(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.bnav-btn').forEach(function(x){x.classList.remove('active');});
  el('page-'+(p==='coach'||p==='runner'?p:'home')).classList.add('active');
  var btn=el('bnav-'+p);if(btn)btn.classList.add('active');
  if(p==='runner')renderRunner();
  if(p==='coach')renderCoach();
  if(p==='home'){el('page-home').classList.add('active');}
}
function switchTab(page,tab,btn){
  var prefix=page+'-';
  document.querySelectorAll('[id^="'+prefix+'"]').forEach(function(c){if(c.classList.contains('tab-content'))c.classList.remove('active');});
  var tc=el(prefix+tab);if(tc)tc.classList.add('active');
  var tabBar=btn.closest('.tab-bar');
  tabBar.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(page==='runner'&&tab==='plans')renderAthleteP lans();
  if(page==='runner'&&tab==='weekly')renderWeeklyForm();
  if(page==='runner'&&tab==='stats')renderStats();
  if(page==='runner'&&tab==='strategy')renderStrategy();
  if(page==='coach'&&tab==='athletes')renderAthletes();
  if(page==='coach'&&tab==='plans')renderCoachPlans();
  if(page==='coach'&&tab==='feedback')renderFeedback();
  if(page==='coach'&&tab==='alerts')renderAlerts();
}

// ── RUNNER ──
function renderRunner(){
  if(!currentUser)return;
  var ini=currentUser.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  el('runner-avatar').textContent=ini;
  el('runner-name-display').textContent=currentUser.name;
  var reports=S.get('ir_all_reports',[]).filter(function(r){return r.runner===currentUser.name;});
  var last=reports[0];
  if(last){
    el('r-stat-km').textContent=last.km+'km';
    el('r-stat-sess').textContent=last.sessions;
    var rec=calcRec(last);
    el('r-stat-rec').textContent=rec+'%';
    el('r-stat-rec').style.color=rec>=70?'#27ae60':rec>=50?'#f39c12':'#e74c3c';
  }
  renderAthletePlans();
}

// ── ATHLETE PLANS ──
function renderAthletePlans(){
  if(!currentUser)return;
  var plans=S.get('ir_plans',[]).filter(function(p){return p.runner===currentUser.name||p.runner==='All';});
  var el2=el('runner-plans');
  if(!plans.length){el2.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No training plan yet.<br>Your coach will assign one soon.</p></div>';return;}
  
  var sel=plans[0];
  var days=sel.calType==='persian'?IR_DAYS:GR_DAYS;
  var workouts=sel.workouts||{};
  var feedbacks=S.get('ir_feedbacks',{});
  
  var h='';
  if(plans.length>1){
    h+='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px">';
    plans.forEach(function(p,i){h+='<button class="chip'+(i===0?' active':'')+'" onclick="selectPlan(''+p.id+'')" style="white-space:nowrap">'+(p.weekLabel||'Week')+'</button>';});
    h+='</div>';
  }
  
  h+='<div style="background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">';
  h+='<div><div style="font-size:13px;font-weight:700;color:#c0392b">'+(sel.intensity||'Base')+' Phase</div>';
  h+='<div style="font-size:11px;color:#484f58;margin-top:2px">'+(sel.weekLabel||sel.weekStart||'')+'</div></div>';
  var sessCount=Object.values(workouts).filter(function(w){return w&&w.type!=='rest';}).length;
  h+='<div style="font-size:18px;font-weight:700;color:#c0392b">'+sessCount+' sessions</div></div>';
  
  days.forEach(function(day){
    var w=workouts[day];
    var wt=w?WT[w.type]:null;
    var fbKey=sel.id+'_'+day;
    var fb=feedbacks[fbKey]||{};
    var borderColor=wt?wt.color+'44':'rgba(255,255,255,.08)';
    
    h+='<div style="background:#1c2128;border:1px solid '+borderColor+';border-radius:14px;padding:16px;margin-bottom:10px">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(w?'10px':'0')+'">';
    if(w)h+='<span style="font-size:18px">'+w.icon+'</span>';
    h+='<div><div style="font-size:14px;font-weight:700;color:'+(wt?wt.color:'#484f58')+'">'+day+'</div>';
    if(w)h+='<div style="font-size:11px;color:#8b949e;margin-top:1px">'+w.label+'</div>';
    h+='</div></div>';
    
    if(w&&w.type!=='rest'){
      h+='<div style="font-size:12px;color:#8b949e;line-height:1.9;background:#21262d;border-radius:8px;padding:10px;margin-bottom:12px">';
      if(w.form.sets)h+='⚡ '+w.form.sets+'×'+(w.form.reps||'')+' '+(w.form.dist||'')+'<br>';
      if(w.form.dist&&!w.form.sets)h+='📏 '+w.form.dist+' km<br>';
      if(w.form.pace)h+='⏱ '+w.form.pace+'/km<br>';
      if(w.form.zone)h+='💓 Zone: '+w.form.zone+'<br>';
      if(w.form.recTime)h+='🔄 Recovery: '+w.form.recTime+(w.form.recType?' ('+w.form.recType+')':'')+'<br>';
      if(w.form.structure)h+='🌈 '+w.form.structure+'<br>';
      if(w.form.nutrition)h+='🍌 '+w.form.nutrition+'<br>';
      if(w.form.warmup)h+='🔥 '+w.form.warmup+'<br>';
      if(w.form.notes)h+='📝 <em style="color:#484f58">'+w.form.notes+'</em>';
      h+='</div>';
      
      // Feedback
      h+='<div class="fb-section">';
      h+='<div style="font-size:11px;font-weight:700;color:#484f58;text-transform:uppercase;margin-bottom:8px">Your Feedback</div>';

function setFb(planId,day,key,val){

}
function saveFb(planId,day){
  var all=S.get('ir_feedbacks',{});

}

function setStratChip(g,v,btn){
  btn.closest('.chips').querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');c.style='';});
  btn.classList.add('active');btn.style='border-color:#c0392b;color:#c0392b;background:rgba(192,57,43,.22)';
  window['_sc_'+g]=v;
}
function calcRaceStrat(){
  var d=parseFloat(el('rs-dist').value);var t=paceToSec(el('rs-target').value);
  if(!d||!t)return;
  var avg=t/d;var iv=parseFloat(el('rs-split').value)||5;var strat=window['_sc_strategy']||'even';
  var splits=[],km=0;
  while(km<d){
    var end=Math.min(km+iv,d);var sd=end-km;var sp=avg;
    if(strat==='negative')sp=km<d/2?avg*1.03:avg*0.97;
    else if(strat==='positive')sp=km<d/2?avg*0.97:avg*1.03;
    else if(strat==='fast-start')sp=km<5?avg*0.95:avg*1.01;
    splits.push({from:km,to:end,pace:sp,time:sp*sd});km=end;
  }
  var h='<div class="card"><div class="card-title">Split Plan</div>';
  h+='<div class="split-row split-head"><span>From</span><span>To</span><span>Pace</span><span>Time</span></div>';
  splits.forEach(function(s){h+='<div class="split-row"><span>'+s.from+'km</span><span>'+s.to.toFixed(1)+'km</span><span style="color:#c0392b;font-weight:600">'+secToPace(s.pace)+'/km</span><span>'+secToTime(Math.round(s.time))+'</span></div>';});
  h+='<div style="background:#21262d;border-radius:8px;padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  [{l:'Distance',v:d+'km'},{l:'Target',v:secToTime(t)},{l:'Avg pace',v:secToPace(avg)+'/km'},{l:'Strategy',v:strat}].forEach(function(x){
    h+='<div><div style="font-size:10px;color:#484f58">'+x.l+'</div><div style="font-size:14px;font-weight:700;color:#c0392b">'+x.v+'</div></div>';
  });
  h+='</div></div>';
  el('rs-result').innerHTML=h;
}

function renderAthletes(){
  var reports=S.get('ir_all_reports',[]);
  var latest={};reports.forEach(function(r){if(!latest[r.runner])latest[r.runner]=r;});
  var runners=Object.values(latest);
  var colors=['#16a34a','#0891b2','#7c3aed','#b45309','#be185d','#0f766e','#1d4ed8','#b91c1c'];
  var h='';
  if(!runners.length){h='<div class="empty"><div class="empty-icon">👥</div><p>No athlete reports yet.<br>Runners submit weekly reports from their dashboard.</p></div>';el('coach-athletes').innerHTML=h;return;}
  runners.forEach(function(r,i){
    var ini=r.runner.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    var col=colors[i%colors.length];
    var dotCol=r.status==='danger'?'#e74c3c':r.status==='warn'?'#f39c12':'#27ae60';
    var ago=Math.round((Date.now()-new Date(r.createdAt))/60000);
    var agoStr=ago<60?ago+'m ago':ago<1440?Math.round(ago/60)+'h ago':Math.round(ago/1440)+'d ago';

function openAthlete(name){

  var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">';
  h+='<div style="width:46px;height:46px;border-radius:50%;background:rgba(8,145,178,.15);color:#0891b2;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">'+ini+'</div>';
  h+='<div><div style="font-size:16px;font-weight:700">'+name+'</div><div style="font-size:12px;color:#8b949e">'+new Date(r.createdAt).toLocaleDateString()+'</div></div>';
  h+='<button onclick="el('athlete-modal').classList.remove('open')" style="margin-left:auto;background:#21262d;border:none;color:#8b949e;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px">✕</button></div>';

  if(r.rhr>65&&r.rhr)h+='<div class="warn-box">High resting HR: '+r.rhr+' bpm</div>';
  h+='<div class="detail-grid">';
  [{l:'Volume',v:(r.km||'—')+'km',c:'#27ae60'},{l:'Sessions',v:r.sessions||'—'},{l:'Long run',v:(r.longRun||'—')+'km'},{l:'Resting HR',v:(r.rhr||'—')+'bpm',c:r.rhr>65?'#f39c12':null},{l:'Sleep',v:(r.sleep||'—')+(r.sleepHrs?' / '+r.sleepHrs+'h':'')},{l:'Motivation',v:(r.motivation||'—')+'/5',c:r.motivation<=2?'#f39c12':null},{l:'Stress',v:r.stress||'—'},{l:'Energy',v:r.energy||'—'}]
  .forEach(function(x){h+='<div class="detail-item"><div class="detail-label">'+x.l+'</div><div class="detail-val" style="color:'+(x.c||'#e6edf3')+'">'+x.v+'</div></div>';});
  h+='</div>';
  if(r.notes)h+='<div style="font-size:10px;font-weight:700;color:#484f58;text-transform:uppercase;margin-bottom:6px">Notes</div><div style="font-size:13px;color:#8b949e;background:#21262d;border-radius:8px;padding:12px;line-height:1.7;margin-bottom:12px">'+r.notes+'</div>';
  h+='<div style="font-size:10px;font-weight:700;color:#484f58;text-transform:uppercase;margin-bottom:8px">Chat with '+name+'</div>';
  h+='<div class="chat-wrap" id="chat-msgs-'+name.replace(/\s/g,'_')+'">'+
    (msgs.length?msgs.map(function(m){return '<div style="display:flex;flex-direction:column;align-items:'+(m.from==='coach'?'flex-start':'flex-end')+'"><div class="msg '+m.from+'">'+m.text+'</div></div>';}).join(''):'<div style="color:#484f58;font-size:13px;text-align:center;padding:12px">No messages yet.</div>')+
    '</div>';
  h+='<div class="chat-row"><textarea class="chat-input" id="chat-input-'+name.replace(/\s/g,'_')+'" rows="1" placeholder="Message '+name+'..."></textarea><button class="chat-send" onclick="sendCoachChat(''+name+'')">➤</button></div>';
  el('athlete-modal-content').innerHTML=h;
  el('athlete-modal').classList.add('open');
  window._openAthlete=name;
}
function sendCoachChat(name){
  var key=name.replace(/\s/g,'_');
  var input=el('chat-input-'+key);
  if(!input||!input.value.trim())return;
  var msgs=S.get('ir_chat_'+name,[]);
  msgs.push({id:S.id(),from:'coach',text:input.value,at:new Date().toISOString()});
  S.set('ir_chat_'+name,msgs);
  input.value='';
  // Re-render chat
  var wrap=el('chat-msgs-'+key);
  if(wrap)wrap.innerHTML=msgs.map(function(m){return '<div style="display:flex;flex-direction:column;align-items:'+(m.from==='coach'?'flex-start':'flex-end')+'"><div class="msg '+m.from+'">'+m.text+'</div></div>';}).join('');
}

// ── COACH PLANS ──
var planBuildState={calType:'gregorian',month:'',weekIdx:0,workouts:{},runner:'',intensity:'Base',sendMode:'immediate'};

function renderCoachPlans(){
  var plans=S.get('ir_plans',[]);
  var allRunners=[...new Set(S.get('ir_all_reports',[]).map(function(r){return r.runner;}))];
  var h='<button class="btn" onclick="showPlanBuilder(null)" style="border:2px dashed #c0392b;background:rgba(192,57,43,.05);margin-bottom:14px">+ Create New Training Plan</button>';

  plans.forEach(function(p){
    h+='<div class="plan-card">';

    h+='<div><div style="font-size:14px;font-weight:700">'+p.runner+'</div><div style="font-size:11px;color:#484f58;margin-top:2px">'+(p.weekLabel||p.weekStart||'No date')+' · '+p.intensity+'</div></div>';
    h+='<button class="btn warn sm" onclick="showPlanBuilder(''+p.id+'')">✏️ Edit</button></div>';
    h+='<div class="plan-text">'+(p.text||'').slice(0,180)+(p.text&&p.text.length>180?'...':'')+'</div></div>';
  });

function showPlanBuilder(planId){
  var allRunners=[...new Set(S.get('ir_all_reports',[]).map(function(r){return r.runner;}))];
  var plan=planId?S.get('ir_plans',[]).find(function(p){return p.id===planId;}):null;
  planBuildState={
    calType:plan?plan.calType:'gregorian',
    month:plan?plan.month:(new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')),
    weekIdx:0,
    workouts:plan?plan.workouts:{},
    runner:plan?plan.runner:'',
    intensity:plan?plan.intensity:'Base',
    sendMode:plan?plan.sendMode:'immediate'
  };
  editingPlanId=planId||null;
  renderPlanBuilder(allRunners,plan);
}

function renderPlanBuilder(runners,plan){
  var days=planBuildState.calType==='persian'?IR_DAYS:GR_DAYS;
  var weeks=planBuildState.month?getWeeks(planBuildState.month,planBuildState.calType):[];
  var curWeek=weeks[planBuildState.weekIdx]||weeks[0];
  var totalKm=Object.values(planBuildState.workouts).reduce(function(s,w){return s+(w?parseFloat(w.form&&w.form.dist||0):0);},0).toFixed(1);

  var h='<button class="back-btn" onclick="renderCoachPlans()">← Back to plans</button>';

  if(!editingPlanId){
    h+='<div class="field"><label>Athlete</label><select id="pb-runner" onchange="planBuildState.runner=this.value"><option value="">-- Select athlete --</option>';
    runners.forEach(function(r){h+='<option value="'+r+'"'+(planBuildState.runner===r?' selected':'')+'>'+r+'</option>';});
    h+='</select></div>';
  }
  
  h+='<div class="field"><label>Calendar type</label><div style="display:flex;gap:8px">';
  [{id:'gregorian',icon:'🗓',label:'Mon–Sun'},{id:'persian',icon:'📅',label:'Sat–Fri (Iran)'}].forEach(function(c){
    h+='<button onclick="planBuildState.calType=''+c.id+'';planBuildState.weekIdx=0;renderPlanBuilder('+JSON.stringify(runners)+','+JSON.stringify(plan||null)+')" style="flex:1;padding:10px 6px;border-radius:10px;border:2px solid '+(planBuildState.calType===c.id?'#c0392b':'rgba(255,255,255,.08)')+';background:'+(planBuildState.calType===c.id?'rgba(192,57,43,.1)':'transparent')+';color:'+(planBuildState.calType===c.id?'#c0392b':'#8b949e')+';font-size:12px;font-weight:700;cursor:pointer;text-align:center"><div style="font-size:18px;margin-bottom:3px">'+c.icon+'</div>'+c.label+'</button>';
  });
  h+='</div></div>';
  
  h+='<div class="field"><label>Month</label><input type="month" id="pb-month" value="'+planBuildState.month+'" onchange="planBuildState.month=this.value;planBuildState.weekIdx=0;renderPlanBuilder('+JSON.stringify(runners)+','+JSON.stringify(plan||null)+')"></div>';
  
  if(weeks.length){
    h+='<div class="field"><label>Select week</label>';
    weeks.forEach(function(w,i){
      h+='<button class="week-btn'+(planBuildState.weekIdx===i?' active':'')+'" onclick="planBuildState.weekIdx='+i+';renderPlanBuilder('+JSON.stringify(runners)+','+JSON.stringify(plan||null)+')">Week '+(i+1)+': '+w.label+(planBuildState.weekIdx===i?' ✓':'')+'</button>';
    });

  h+='<div class="field"><label>Intensity phase</label><div class="chips">';

    var isSel=planBuildState.intensity===o.label;var col=o.color||'#c0392b';
    h+='<button class="chip'+(isSel?' active':'')+'" style="'+(isSel?'border-color:'+col+';color:'+col+';background:'+col+'22':'')+'" onclick="planBuildState.intensity=''+o.label+'';renderPlanBuilder('+JSON.stringify(runners)+','+JSON.stringify(plan||null)+')">'+o.label+'</button>';
  });
  h+='</div></div>';
  
  h+='<div style="background:#21262d;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#8b949e">Total estimated volume</div><div style="font-size:20px;font-weight:700;color:#c0392b">'+totalKm+' km</div></div>';
  h+='</div>';
  
  h+='<div class="section-label">Weekly Schedule — '+days[0]+' to '+days[6]+'</div>';
  days.forEach(function(day){
    var w=planBuildState.workouts[day];
    var wt=w?WT[w.type]:null;
    h+='<div class="day-card'+(wt?' has-workout':'')+'" style="'+(wt?'border-color:'+wt.color+'44':'')+'">';
    h+='<div class="day-header">';
    h+='<div style="display:flex;align-items:center;gap:8px">'+(wt?'<span style="font-size:18px">'+wt.icon+'</span>':'')+
       '<div><div class="day-name" style="'+(wt?'color:'+wt.color:'')+'">'+(wt?wt.label+' — ':'')+day+'</div></div></div>';

      if(w.form.zone)h+='💓 '+w.form.zone;
      if(w.form.notes)h+='<br><em style="color:#484f58">'+w.form.notes+'</em>';

  });
  
  h+='<div class="card" style="margin-top:8px"><div class="card-title">Send Options</div>';

  el('coach-plans').innerHTML=h;

function clearWorkout(day,runners,plan){
  delete planBuildState.workouts[day];
  renderPlanBuilder(runners,plan);
}
function togglePreview(){
  var p=el('plan-preview');
  if(p.style.display==='none'){
    var days=planBuildState.calType==='persian'?IR_DAYS:GR_DAYS;
    var text=days.map(function(d){
      var w=planBuildState.workouts[d];
      if(!w||w.type==='rest')return d+': Rest';
      var l=d+': '+w.label;
      if(w.form.sets)l+=' — '+w.form.sets+'×'+(w.form.reps||'')+' '+(w.form.dist||'');
      if(w.form.dist&&!w.form.sets)l+=' — '+w.form.dist+'km';
      if(w.form.pace)l+=' @ '+w.form.pace+'/km';
      if(w.form.zone)l+=' ['+w.form.zone+']';
      if(w.form.notes)l+=' · '+w.form.notes;
      return l;
    }).join('
');
    p.innerHTML='<div class="plan-text" style="margin-top:12px">'+text+'</div>';
    p.style.display='block';
  } else {p.style.display='none';}
}
function savePlan(runners,plan){
  if(!planBuildState.runner&&!editingPlanId){alert('Please select an athlete');return;}
  var weeks=planBuildState.month?getWeeks(planBuildState.month,planBuildState.calType):[];
  var curWeek=weeks[planBuildState.weekIdx]||weeks[0];
  var days=planBuildState.calType==='persian'?IR_DAYS:GR_DAYS;
  var text=days.map(function(d){
    var w=planBuildState.workouts[d];
    if(!w||w.type==='rest')return d+': Rest';
    var l=d+': '+w.label;
    if(w.form.sets)l+=' — '+w.form.sets+'×'+(w.form.reps||'')+' '+(w.form.dist||'');
    if(w.form.dist&&!w.form.sets)l+=' — '+w.form.dist+'km';
    if(w.form.pace)l+=' @ '+w.form.pace+'/km';
    if(w.form.notes)l+=' · '+w.form.notes;
    return l;
  }).join('
');
  var newPlan={
    id:editingPlanId||S.id(),
    runner:planBuildState.runner,
    calType:planBuildState.calType,
    month:planBuildState.month,
    weekStart:curWeek?curWeek.start.toISOString().slice(0,10):'',
    weekLabel:curWeek?curWeek.label:'',
    intensity:planBuildState.intensity,
    workouts:planBuildState.workouts,
    sendMode:planBuildState.sendMode,
    text:text,
    createdAt:editingPlanId?(S.get('ir_plans',[]).find(function(p){return p.id===editingPlanId;})||{}).createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  var plans=S.get('ir_plans',[]);
  if(editingPlanId){var idx=plans.findIndex(function(p){return p.id===editingPlanId;});if(idx>=0)plans[idx]=newPlan;else plans.unshift(newPlan);}
  else plans.unshift(newPlan);
  S.set('ir_plans',plans);
  alert(editingPlanId?'Plan updated! Athlete will see changes.':'Plan saved and sent to '+planBuildState.runner+'!');
  renderCoachPlans();
}

    h+='<div class="field"><label>Duration (min)</label><input type="number" placeholder="25" value="'+(currentWTForm.duration||'')+'" onchange="currentWTForm.duration=this.value"></div>';
    h+='</div>';
    h+='<div class="field"><label>Zone</label><div class="chips">'+['Z3','Z3-Z4','Z4'].map(function(v){return '<button class="chip'+(currentWTForm.zone===v?' active':'')+'" onclick="currentWTForm.zone=''+v+'';this.closest('.chips').querySelectorAll('.chip').forEach(function(c){c.className='chip';c.style=''});this.className='chip active';this.style='border-color:#c0392b;color:#c0392b;background:rgba(192,57,43,.22)'">'+v+'</button>';}).join('')+'</div></div>';
  }
  if(currentWTType==='fartlek'){
    h+='<div class="field"><label>Total distance (km)</label><input type="number" step="0.5" placeholder="8" value="'+(currentWTForm.dist||'')+'" onchange="currentWTForm.dist=this.value"></div>';
    h+='<div class="field"><label>Structure</label><textarea rows="3" placeholder="e.g. 1km easy, 2min hard, 1min easy ×5" onchange="currentWTForm.structure=this.value">'+(currentWTForm.structure||'')+'</textarea></div>';
  }
  if(currentWTType!=='rest'){
    h+='<div class="field"><label>Notes / Instructions</label><textarea rows="2" placeholder="Additional instructions..." onchange="currentWTForm.notes=this.value">'+(currentWTForm.notes||'')+'</textarea></div>';
  } else {
    h+='<div class="field"><label>Optional notes</label><textarea rows="2" placeholder="e.g. foam rolling, 20min yoga..." onchange="currentWTForm.notes=this.value">'+(currentWTForm.notes||'')+'</textarea></div>';
  }
  
  h+='<div style="display:flex;gap:8px;margin-top:12px">';
  h+='<button class="btn secondary" style="margin-top:0" onclick="closeWorkoutModal()">Cancel</button>';
  h+='<button class="btn" style="flex:2;margin-top:0;background:'+wt.color+'" onclick="saveWorkout()">Save Workout</button>';
  h+='</div>';
  
  el('workout-modal-content').innerHTML=h;
}
function setWTType(type){
  currentWTType=type;currentWTForm={};
  renderWorkoutModal();
}
function saveWorkout(){
  var wt=WT[currentWTType];
  planBuildState.workouts[currentWTDay]={type:currentWTType,form:Object.assign({},currentWTForm),label:wt.label,icon:wt.icon,color:wt.color};
  closeWorkoutModal();
  // Re-render plan builder
  var allRunners=[...new Set(S.get('ir_all_reports',[]).map(function(r){return r.runner;}))];
  renderPlanBuilder(allRunners,null);
}

// ── FEEDBACK (Coach view) ──
function renderFeedback(){
  var plans=S.get('ir_plans',[]);
  var feedbacks=S.get('ir_feedbacks',{});
  var h='';
  if(!plans.length){h='<div class="empty"><div class="empty-icon">💬</div><p>No plans created yet.</p></div>';el('coach-feedback').innerHTML=h;return;}
  plans.forEach(function(p){
    var planFbs=Object.entries(feedbacks).filter(function(e){return e[0].startsWith(p.id+'_');}).map(function(e){return {day:e[0].slice(p.id.length+1),fb:e[1]};});
    h+='<div class="plan-card"><div style="font-size:14px;font-weight:700;margin-bottom:4px">'+p.runner+'</div>';
    h+='<div style="font-size:11px;color:#484f58;margin-bottom:10px">'+(p.weekLabel||p.weekStart||'')+'</div>';
    if(!planFbs.length){h+='<div style="font-size:12px;color:#484f58;font-style:italic">No feedback yet.</div>';}
    else planFbs.forEach(function(item){
      var fb=item.fb;
      h+='<div style="background:#21262d;border-radius:8px;padding:10px;margin-bottom:6px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
      h+='<div style="font-size:13px;font-weight:600">'+item.day+'</div>';
      h+='<div style="display:flex;gap:4px">';
      if(fb.done===true)h+='<span class="tag tag-ok">✅ Done</span>';
      if(fb.done===false)h+='<span class="tag tag-danger">❌ Not done</span>';
      if(fb.feel)h+='<span class="tag tag-blue">'+fb.feel+'</span>';
      h+='</div></div>';
      h+='<div style="font-size:12px;color:#8b949e;line-height:1.6">';
      if(fb.dist)h+='📏 '+fb.dist+'km  ';
      if(fb.pace)h+='⏱ '+fb.pace+'/km  ';
      if(fb.rpe)h+='💪 RPE '+fb.rpe;
      if(fb.notes)h+='<br><em style="color:#484f58">'+fb.notes+'</em>';
      h+='</div></div>';
    });
    h+='</div>';
  });
  el('coach-feedback').innerHTML=h;
}

// ── ALERTS ──
function renderAlerts(){
  var reports=S.get('ir_all_reports',[]);
  var latest={};reports.forEach(function(r){if(!latest[r.runner])latest[r.runner]=r;});
  var runners=Object.values(latest).filter(function(r){return r.status!=='ok';});
  var h='';
  if(!runners.length){h='<div class="empty"><div class="empty-icon">✅</div><p>No active alerts!</p></div>';el('coach-alerts').innerHTML=h;return;}
  runners.forEach(function(r){
    h+='<div class="'+(r.status==='danger'?'alert-box':'warn-box')+'"><strong>'+r.runner+'</strong> — '+(r.alerts||[]).join(', ')+'<div style="font-size:11px;margin-top:4px;opacity:.7">'+new Date(r.createdAt).toLocaleDateString()+'</div></div>';
  });
  el('coach-alerts').innerHTML=h;
}

// ── INIT ──
if(currentUser){
  el('nav-username').textContent=currentUser.name.split(' ')[0];
  showPage(currentUser.role==='coach'?'coach':'runner');
} else {
  el('page-home').classList.add('active');
}

// Bottom nav
document.getElementById('bnav-runner').addEventListener('click',function(){loginAs('runner');});
document.getElementById('bnav-coach').addEventListener('click',function(){loginAs('coach');});
</script>
</body>
