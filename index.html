async function db(table, method = "GET", data = null, filter = "") {
  try {
    const url = `${SUPA_URL}/rest/v1/${table}${filter}`;
    const headers = {
      apikey: SUPA_KEY,
      Authorization: `Bearer ${SUPA_KEY}`,
      "Content-Type": "application/json",
      Prefer: method === "POST" ? "return=representation" : "",
    };
    const opts = { method, headers };
    if (data) opts.body = JSON.stringify(data);
    const res = await fetch(url, opts);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function calcRecovery(r) {
  let s = 70;
  if (r.resting_hr > 65) s -= 15;
  if (r.motivation <= 2) s -= 10;
  if (r.sleep_hrs < 6 && r.sleep_hrs > 0) s -= 15;
  if (r.pain === "Serious pain") s -= 20;
  if (r.recovery === "Fast") s += 15;
  if (r.sleep_quality === "Excellent") s += 10;
  return Math.max(10, Math.min(100, s));
}

// ── CHIP COMPONENT ──
function Chips({ options, value, onChange, multi = false }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      {options.map((opt) => {
        const sel = multi ? value.includes(opt.label) : value === opt.label;
        return (
          <button
            key={opt.label}
            onClick={() => {
              if (multi) {
                onChange(sel ? value.filter((v) => v !== opt.label) : [...value, opt.label]);
              } else {
                onChange(sel ? "" : opt.label);
              }
            }}
            style={{
              padding: "7px 14px", borderRadius: 20, fontSize: 13, fontWeight: 500,
              border: `1px solid ${sel ? opt.color || "#c0392b" : "rgba(255,255,255,0.1)"}`,
              background: sel ? opt.color || "#c0392b" : "rgba(255,255,255,0.05)",
              color: sel ? "#fff" : "#8b949e", cursor: "pointer",
            }}
          >
            {opt.label}
          </button>
        );
      })}
    </div>
  );
}

// ── SETUP ──
function Setup({ onSave }) {
  const [name, setName] = useState("");
  const [age, setAge] = useState("");
  const [weight, setWeight] = useState("");
  const [height, setHeight] = useState("");
  const [rhr, setRhr] = useState("");
  const [maxDist, setMaxDist] = useState("");
  const [sessions, setSessions] = useState("");
  const [category, setCategory] = useState("");
  const [goal, setGoal] = useState("");
  const [pr5, setPr5] = useState(""); const [pr10, setPr10] = useState("");
  const [pr21, setPr21] = useState(""); const [pr42, setPr42] = useState("");
  const [notes, setNotes] = useState("");
  const [saving, setSaving] = useState(false);

  const save = async () => {
    if (!name.trim()) { alert("Please enter your name"); return; }
    setSaving(true);
    const profile = {
      name: name.trim(), age: parseInt(age) || null, weight: parseFloat(weight) || null,
      height: parseInt(height) || null, resting_hr: parseInt(rhr) || null,
      max_distance: parseFloat(maxDist) || null, weekly_sessions: parseInt(sessions) || null,
      training_category: category || null,
      goals: [goal, pr5 ? `5K: ${pr5}min` : "", pr10 ? `10K: ${pr10}min` : "", pr21 ? `HM: ${pr21}min` : "", pr42 ? `M: ${pr42}min` : "", notes].filter(Boolean).join(", "),
    };
    await db("runners", "POST", profile);
    localStorage.setItem("ir_runner", name.trim());
    setSaving(false);
    onSave(name.trim());
  };

  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 700, color: "#484f58", textTransform: "uppercase", letterSpacing: "0.1em", margin: "20px 0 10px" }}>Create Your Profile</div>
      <Card title="Basic Info">
        <Field label="Full Name"><Input placeholder="e.g. Ali Rezaei" value={name} onChange={setName} /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Age"><Input type="number" placeholder="28" value={age} onChange={setAge} /></Field>
          <Field label="Weight (kg)"><Input type="number" placeholder="70" value={weight} onChange={setWeight} /></Field>
          <Field label="Height (cm)"><Input type="number" placeholder="175" value={height} onChange={setHeight} /></Field>
          <Field label="Resting HR"><Input type="number" placeholder="55" value={rhr} onChange={setRhr} /></Field>
        </div>
      </Card>
      <Card title="Training Background">
        <Field label="Max distance ever run (km)"><Input type="number" placeholder="21" value={maxDist} onChange={setMaxDist} /></Field>
        <Field label="Weekly sessions"><Input type="number" placeholder="4" value={sessions} onChange={setSessions} /></Field>
        <Field label="Level">
          <Chips value={category} onChange={setCategory} options={[{label:"Beginner"},{label:"Intermediate"},{label:"Advanced"},{label:"Elite"}]} />
        </Field>
      </Card>
      <Card title="Personal Records">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="5km PR (min)"><Input type="number" placeholder="22" step="0.1" value={pr5} onChange={setPr5} /></Field>
          <Field label="10km PR (min)"><Input type="number" placeholder="47" step="0.1" value={pr10} onChange={setPr10} /></Field>
          <Field label="Half Marathon (min)"><Input type="number" placeholder="105" step="0.1" value={pr21} onChange={setPr21} /></Field>
          <Field label="Marathon (min)"><Input type="number" placeholder="240" step="0.1" value={pr42} onChange={setPr42} /></Field>

      </Card>

        <Field label="Primary goal">
          <Chips value={goal} onChange={setGoal} options={["Finish 5K","Run 10K","Half Marathon","Marathon","Improve pace","Lose weight","Stay healthy"].map(l=>({label:l}))} />

        <Field label="Notes">
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2} placeholder="e.g. Sub-4h marathon by end of year..." style={{width:"100%",background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"11px 13px",fontSize:14,color:"#e6edf3",outline:"none",resize:"none"}} />

// ── WEEKLY FORM ──
function WeeklyForm({ runnerName, onSubmit }) {
  const [km, setKm] = useState(""); const [sessions, setSessions] = useState(""); const [longrun, setLongrun] = useState("");
  const [pace, setPace] = useState(""); const [tempo, setTempo] = useState(""); const [cadence, setCadence] = useState("");
  const [pctEasy, setPctEasy] = useState(""); const [pctMod, setPctMod] = useState(""); const [pctHard, setPctHard] = useState("");
  const [rhr, setRhr] = useState(""); const [sleepHrs, setSleepHrs] = useState("");
  const [sleep, setSleep] = useState(""); const [pain, setPain] = useState(""); const [painLoc, setPainLoc] = useState("");
  const [weightChange, setWeightChange] = useState(""); const [motivation, setMotivation] = useState(3);
  const [energy, setEnergy] = useState(""); const [stress, setStress] = useState(""); const [recovery, setRecovery] = useState("");
  const [raceDist, setRaceDist] = useState(""); const [raceTime, setRaceTime] = useState(""); const [raceCond, setRaceCond] = useState("");
  const [notes, setNotes] = useState(""); const [rpe, setRpe] = useState(5);
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    setSaving(true);
    const alerts = [];
    let status = "ok";
    if (pain === "Serious pain") { status = "danger"; alerts.push("Serious pain"); }
    if (parseInt(rhr) > 65 && rhr) { if (status === "ok") status = "warn"; alerts.push("High resting HR"); }
    if (motivation <= 2) { if (status === "ok") status = "warn"; alerts.push("Low motivation"); }
    if (stress === "Very high") { if (status === "ok") status = "warn"; alerts.push("Very high stress"); }
    if (pain === "Mild pain") { if (status === "ok") status = "warn"; alerts.push("Mild pain"); }
    if (parseFloat(sleepHrs) < 6 && sleepHrs) { if (status === "ok") status = "warn"; alerts.push("Sleep < 6h"); }
    if (energy === "Very low") { if (status === "ok") status = "warn"; alerts.push("Very low energy"); }

    const rep = {
      runner_name: runnerName, km: parseFloat(km)||0, sessions: parseInt(sessions)||0,
      long_run: parseFloat(longrun)||0, easy_pace: parseFloat(pace)||0, tempo_pace: parseFloat(tempo)||0,
      cadence: parseInt(cadence)||0, pct_easy: parseInt(pctEasy)||0, pct_mod: parseInt(pctMod)||0,
      pct_hard: parseInt(pctHard)||0, resting_hr: parseInt(rhr)||0, sleep_hrs: parseFloat(sleepHrs)||0,
      sleep_quality: sleep, pain, pain_location: painLoc, weight_change: weightChange,
      motivation, energy, stress, recovery, race_dist: parseFloat(raceDist)||0,
      race_time: parseFloat(raceTime)||0, race_conditions: raceCond, notes, status,
      alerts: alerts.join(", "),
    };
    await db("weekly_reports", "POST", rep);
    setSaving(false);
    onSubmit();
  };

  const now = new Date();
  return (
    <div>
      <div style={{ background: "linear-gradient(135deg,#1a2540,#0d1117)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 14, padding: 24, marginBottom: 12 }}>
        <div style={{ fontSize: 12, color: "#484f58", marginBottom: 4 }}>Week {now.getDate()}/{now.getMonth()+1}/{now.getFullYear()}</div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>Weekly Report</div>
        <div style={{ fontSize: 13, color: "#8b949e" }}>A few minutes — your coach sees everything</div>
      </div>

      <Card title="Training Data">
        <Field label="Total volume (km)"><Input type="number" placeholder="52" value={km} onChange={setKm} /></Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Sessions"><Input type="number" placeholder="5" value={sessions} onChange={setSessions} /></Field>
          <Field label="Long run (km)"><Input type="number" placeholder="18" value={longrun} onChange={setLongrun} /></Field>
          <Field label="Easy pace (min/km)"><Input type="number" placeholder="5.30" step="0.01" value={pace} onChange={setPace} /></Field>
          <Field label="Tempo pace (min/km)"><Input type="number" placeholder="4.20" step="0.01" value={tempo} onChange={setTempo} /></Field>
        </div>
        <Field label="Cadence (spm) — optional"><Input type="number" placeholder="168" value={cadence} onChange={setCadence} /></Field>
        <Field label="Intensity distribution">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <div><div style={{ fontSize: 10, color: "#484f58", marginBottom: 4 }}>Easy %</div><Input type="number" placeholder="70" value={pctEasy} onChange={setPctEasy} /></div>
            <div><div style={{ fontSize: 10, color: "#484f58", marginBottom: 4 }}>Moderate %</div><Input type="number" placeholder="20" value={pctMod} onChange={setPctMod} /></div>
            <div><div style={{ fontSize: 10, color: "#484f58", marginBottom: 4 }}>Hard %</div><Input type="number" placeholder="10" value={pctHard} onChange={setPctHard} /></div>
          </div>
        </Field>
        <Field label={`Session difficulty: ${rpe}/10`}>
          <input type="range" min={1} max={10} value={rpe} onChange={e=>setRpe(parseInt(e.target.value))}
            style={{ width: "100%", accentColor: "#c0392b" }} />
        </Field>
      </Card>

      <Card title="Body Signals">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Resting HR (bpm)"><Input type="number" placeholder="54" value={rhr} onChange={setRhr} /></Field>
          <Field label="Sleep hours"><Input type="number" placeholder="7.5" step="0.5" value={sleepHrs} onChange={setSleepHrs} /></Field>
        </div>
        <Field label="Sleep quality">
          <Chips value={sleep} onChange={setSleep} options={["Poor","Average","Good","Excellent"].map(l=>({label:l}))} />
        </Field>
        <Field label="Pain / injury">
          <Chips value={pain} onChange={setPain} options={[{label:"No pain"},{label:"Mild pain",color:"#f39c12"},{label:"Serious pain",color:"#e74c3c"}]} />
        </Field>
        <Field label="Pain location (if any)"><Input placeholder="e.g. right knee" value={painLoc} onChange={setPainLoc} /></Field>
        <Field label="Weight change">
          <Chips value={weightChange} onChange={setWeightChange} options={["Lost","Stable","Gained"].map(l=>({label:l}))} />
        </Field>
      </Card>

      <Card title="Mental & Recovery">
        <Field label={`Motivation: ${motivation}/5`}>
          <input type="range" min={1} max={5} value={motivation} onChange={e=>setMotivation(parseInt(e.target.value))}
            style={{ width: "100%", accentColor: "#c0392b" }} />
        </Field>
        <Field label="Energy level">
          <Chips value={energy} onChange={setEnergy} options={[{label:"Very low",color:"#e74c3c"},{label:"Low",color:"#f39c12"},{label:"Normal"},{label:"High"}]} />
        </Field>
        <Field label="Life stress">
          <Chips value={stress} onChange={setStress} options={[{label:"Low"},{label:"Moderate"},{label:"High",color:"#f39c12"},{label:"Very high",color:"#e74c3c"}]} />
        </Field>
        <Field label="Recovery feeling">
          <Chips value={recovery} onChange={setRecovery} options={[{label:"Very slow",color:"#e74c3c"},{label:"Slow",color:"#f39c12"},{label:"Normal"},{label:"Fast",color:"#27ae60"}]} />
        </Field>
      </Card>

      <Card title="Race / Time Trial (if any)">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Distance (km)"><Input type="number" placeholder="10" step="0.1" value={raceDist} onChange={setRaceDist} /></Field>
          <Field label="Time (min)"><Input type="number" placeholder="42.5" step="0.1" value={raceTime} onChange={setRaceTime} /></Field>
        </div>
        <Field label="Conditions">
          <Chips value={raceCond} onChange={setRaceCond} options={["Good","Hot","Rainy","Windy","Hilly"].map(l=>({label:l}))} />
        </Field>
      </Card>

      <Card title="Notes for Coach">
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} placeholder="Anything your coach should know..."
          style={{ width:"100%",background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"11px 13px",fontSize:14,color:"#e6edf3",outline:"none",resize:"none" }} />
      </Card>
      <Btn onClick={submit}>{saving ? "Submitting..." : "Submit Weekly Report"}</Btn>
    </div>
  );
}

// ── RUNNER DASHBOARD ──
function RunnerDashboard({ runnerName }) {
  const [tab, setTab] = useState("weekly");
  const [submitted, setSubmitted] = useState(false);
  const [profile, setProfile] = useState(null);
  const [lastReport, setLastReport] = useState(null);
  const [plan, setPlan] = useState(null);
  const [messages, setMessages] = useState([]);
  const [msgText, setMsgText] = useState("");
  const chatRef = useRef(null);

  useEffect(() => {
    db("runners","GET",null,`?name=eq.${encodeURIComponent(runnerName)}&limit=1`).then(r=>r&&r[0]&&setProfile(r[0]));
    db("weekly_reports","GET",null,`?runner_name=eq.${encodeURIComponent(runnerName)}&order=created_at.desc&limit=1`).then(r=>r&&r[0]&&setLastReport(r[0]));
    db("training_plans","GET",null,`?runner_name=eq.${encodeURIComponent(runnerName)}&order=created_at.desc&limit=1`).then(r=>r&&r[0]&&setPlan(r[0]));
  }, [runnerName, submitted]);

  useEffect(() => {
    if (tab === "chat") loadMessages();
  }, [tab]);

  const loadMessages = () => {
    db("messages","GET",null,`?runner_name=eq.${encodeURIComponent(runnerName)}&order=created_at.asc&limit=50`)
      .then(r=>{ if(r) setMessages(r); setTimeout(()=>chatRef.current?.scrollTo(0,9999),100); });
  };

  const sendMsg = async () => {
    if (!msgText.trim()) return;
    const t = msgText; setMsgText("");
    await db("messages","POST",{runner_name:runnerName,from_coach:false,message:t});
    loadMessages();
  };

  const ini = runnerName.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const recovery = lastReport ? calcRecovery(lastReport) : null;

  const tabs = ["weekly","biomech","nutrition","strength","chat"];
  const tabLabels = {weekly:"Weekly",biomech:"Biomech",nutrition:"Nutrition",strength:"Strength",chat:"Chat"};

  return (
    <div>
      {/* Profile hero */}
      <div style={{ background:"linear-gradient(135deg,#1a1a2e,#0d1117)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20,marginBottom:12,position:"relative",overflow:"hidden" }}>
        <div style={{ display:"flex",alignItems:"flex-start",gap:14 }}>
          <div style={{ width:72,height:72,borderRadius:"50%",background:"rgba(192,57,43,0.15)",border:"3px solid #c0392b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:700,color:"#c0392b",flexShrink:0 }}>{ini}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:20,fontWeight:700 }}>{runnerName}</div>
            <div style={{ fontSize:13,color:"#8b949e",marginTop:2 }}>{profile?.training_category||"Runner"}</div>
          </div>
        </div>
        <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:14 }}>
          {[{val:lastReport?.km||"—",lbl:"km this week"},{val:lastReport?.sessions||"—",lbl:"sessions"},{val:recovery?`${recovery}%`:"—",lbl:"recovery"}].map(s=>(
            <div key={s.lbl} style={{ background:"rgba(255,255,255,0.04)",borderRadius:8,padding:10,textAlign:"center" }}>
              <div style={{ fontSize:20,fontWeight:700,color:"#c0392b" }}>{s.val}</div>
              <div style={{ fontSize:10,color:"#484f58",marginTop:2 }}>{s.lbl}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Tab bar */}
      <div style={{ display:"flex",gap:2,background:"#21262d",borderRadius:8,padding:3,marginBottom:16 }}>
        {tabs.map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{ flex:1,padding:8,fontSize:11,fontWeight:600,border:"none",background:tab===t?"#1c2128":"transparent",color:tab===t?"#e6edf3":"#8b949e",cursor:"pointer",borderRadius:6 }}>{tabLabels[t]}</button>
        ))}
      </div>

      {tab==="weekly" && (
        submitted ? (
          <div style={{ textAlign:"center",padding:"60px 20px" }}>
            <div style={{ width:72,height:72,borderRadius:"50%",background:"rgba(39,174,96,0.15)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px",fontSize:32 }}>✓</div>
            <div style={{ fontSize:20,fontWeight:700,marginBottom:8 }}>Report submitted!</div>
            <div style={{ fontSize:14,color:"#8b949e",lineHeight:1.7 }}>Your coach received this week's report.</div>
            <Btn onClick={()=>setSubmitted(false)}>New report</Btn>
          </div>
        ) : (
          <div>
            <WeeklyForm runnerName={runnerName} onSubmit={()=>setSubmitted(true)} />
            {plan && (
              <div style={{ marginTop:20 }}>
                <div style={{ fontSize:10,fontWeight:700,color:"#484f58",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10 }}>Your Training Plan</div>
                <Card>
                  <div style={{ fontSize:13,fontWeight:700,color:"#c0392b",marginBottom:8 }}>Week of {plan.week_start||""} — {plan.intensity}</div>
                  <div style={{ fontSize:13,color:"#8b949e",lineHeight:1.7,whiteSpace:"pre-wrap" }}>{plan.plan}</div>
                </Card>
              </div>
            )}
          </div>
        )
      )}

      {tab==="biomech" && (
        <Card title="Upload Running Photo">
          <Field label="Take a photo from the side or back while running">
            <div style={{ background:"#161b22",border:"1px dashed rgba(255,255,255,0.1)",borderRadius:8,padding:24,textAlign:"center",cursor:"pointer" }}>
              <div style={{ fontSize:28,marginBottom:8 }}>📷</div>
              <div style={{ fontSize:13,color:"#8b949e" }}>Tap to upload photo</div>
              <input type="file" accept="image/*" style={{ display:"none" }} />
            </div>
          </Field>
          <Field label="View angle">
            <Chips value="" onChange={()=>{}} options={["Side view","Back view","Front view"].map(l=>({label:l}))} />
          </Field>
          <Btn onClick={()=>alert("Photo sent to coach!")}>Send to Coach</Btn>
        </Card>
      )}

      {tab==="nutrition" && (
        <div>
          <Card title="Today's Nutrition Log">
            <Field label="Carbohydrates (g)"><Input type="number" placeholder="300" value="" onChange={()=>{}} /></Field>
            <Field label="Protein (g)"><Input type="number" placeholder="120" value="" onChange={()=>{}} /></Field>
            <Field label="Water (liters)"><Input type="number" placeholder="2.5" step="0.1" value="" onChange={()=>{}} /></Field>
            <Field label="Pre-run fuel">
              <Chips value="" onChange={()=>{}} options={["Nothing","Light snack","Full meal","Gel/Sports drink"].map(l=>({label:l}))} />
            </Field>
            <Btn onClick={()=>alert("Nutrition log saved!")}>Save Log</Btn>
          </Card>
          <div style={{ textAlign:"center",padding:"20px",color:"#484f58",fontSize:13 }}>Nutrition plan from coach will appear here.</div>
        </div>
      )}

      {tab==="strength" && (
        <div>
          <Card title="This Week's Strength Work">
            <Field label="Sessions completed"><Input type="number" placeholder="2" value="" onChange={()=>{}} /></Field>
            <Field label="Focus area">
              <Chips value="" onChange={()=>{}} options={["Core","Glutes","Legs","Upper body","Full body"].map(l=>({label:l}))} />
            </Field>
            <Field label="Notes"><textarea rows={2} placeholder="What exercises did you do?" style={{width:"100%",background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"11px 13px",fontSize:14,color:"#e6edf3",outline:"none",resize:"none"}} /></Field>
            <Btn onClick={()=>alert("Saved!")}>Save</Btn>
          </Card>
        </div>
      )}

      {tab==="chat" && (
        <Card title="Chat with Coach">
          <div ref={chatRef} style={{ display:"flex",flexDirection:"column",gap:8,maxHeight:300,overflowY:"auto",marginBottom:12 }}>
            {messages.length===0 ? (
              <div style={{ textAlign:"center",padding:20,color:"#484f58",fontSize:13 }}>No messages yet. Say hello!</div>
            ) : messages.map(m=>(
              <div key={m.id} style={{ display:"flex",flexDirection:"column",alignItems:m.from_coach?"flex-start":"flex-end" }}>
                <div style={{ maxWidth:"80%",padding:"10px 14px",borderRadius:14,fontSize:13,lineHeight:1.5,background:m.from_coach?"#c0392b":"#21262d",color:"#fff",borderRadius:m.from_coach?"4px 14px 14px 14px":"14px 4px 14px 14px" }}>{m.message}</div>
                <div style={{ fontSize:10,color:"#484f58",marginTop:3 }}>{new Date(m.created_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div>
              </div>
            ))}
          </div>
          <div style={{ display:"flex",gap:8,alignItems:"flex-end" }}>
            <textarea value={msgText} onChange={e=>setMsgText(e.target.value)} rows={1} placeholder="Message your coach..."
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}}}
              style={{ flex:1,background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"10px 12px",fontSize:14,color:"#e6edf3",outline:"none",resize:"none" }} />
            <button onClick={sendMsg} style={{ width:40,height:40,borderRadius:"50%",background:"#c0392b",border:"none",color:"#fff",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>➤</button>
          </div>
        </Card>
      )}
    </div>
  );
}

// ── COACH PANEL ──
function CoachPanel() {
  const [unlocked, setUnlocked] = useState(false);
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [reports, setReports] = useState([]);
  const [filter, setFilter] = useState("all");
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("athletes");
  const [planRunner, setPlanRunner] = useState("");
  const [planWeek, setPlanWeek] = useState("");
  const [planIntensity, setPlanIntensity] = useState("");
  const [planText, setPlanText] = useState("");
  const [chatMsgs, setChatMsgs] = useState([]);
  const [coachMsg, setCoachMsg] = useState("");

  useEffect(() => { if (unlocked) loadReports(); }, [unlocked]);

  const loadReports = async () => {
    const r = await db("weekly_reports","GET",null,"?order=created_at.desc&limit=100");
    if (r) { const latest={}; r.forEach(x=>{if(!latest[x.runner_name])latest[x.runner_name]=x;}); setReports(Object.values(latest)); }
  };

  useEffect(() => {
    if (selected) {
      db("messages","GET",null,`?runner_name=eq.${encodeURIComponent(selected.runner_name)}&order=created_at.asc&limit=50`).then(r=>r&&setChatMsgs(r));
    }
  }, [selected]);

  const savePlan = async () => {
    if (!planRunner || !planText) { alert("Select athlete and write plan"); return; }
    await db("training_plans","POST",{runner_name:planRunner,week_start:planWeek||null,plan:planText,intensity:planIntensity||"Base"});
    alert(`Plan saved for ${planRunner}!`);
  };

  const sendCoachMsg = async () => {
    if (!coachMsg.trim() || !selected) return;
    const t = coachMsg; setCoachMsg("");
    await db("messages","POST",{runner_name:selected.runner_name,from_coach:true,message:t});
    db("messages","GET",null,`?runner_name=eq.${encodeURIComponent(selected.runner_name)}&order=created_at.asc&limit=50`).then(r=>r&&setChatMsgs(r));
  };

  const filtered = filter==="all" ? reports : reports.filter(r=>r.status===filter);
  const colors = ["#16a34a","#0891b2","#7c3aed","#b45309","#be185d","#0f766e","#1d4ed8","#b91c1c"];

  if (!unlocked) return (
    <div style={{ minHeight:"80vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:40,textAlign:"center" }}>
      <div style={{ fontSize:44,marginBottom:20 }}>🔒</div>
      <div style={{ fontSize:22,fontWeight:700,marginBottom:6 }}>Coach Panel</div>
      <div style={{ fontSize:14,color:"#8b949e",marginBottom:32 }}>Enter your password</div>
      <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(pass===COACH_PASS?(setUnlocked(true),setErr("")):(setErr("Incorrect password"),setPass("")))}
        placeholder="••••••" maxLength={12}
        style={{ width:"100%",maxWidth:260,background:"#1c2128",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:14,fontSize:20,color:"#e6edf3",outline:"none",textAlign:"center",letterSpacing:8,marginBottom:12 }} />
      <Btn onClick={()=>{ if(pass===COACH_PASS){setUnlocked(true);setErr("");}else{setErr("Incorrect password");setPass("");} }}>Enter</Btn>
      {err && <div style={{ color:"#f87171",fontSize:13,marginTop:8 }}>{err}</div>}
    </div>
  );

  const dangers = reports.filter(r=>r.status==="danger").length;
  const warns = reports.filter(r=>r.status==="warn").length;

  return (
    <div>
      {/* Stats */}
      <div style={{ display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16 }}>
        {[{val:reports.length,lbl:"Reports",c:"#27ae60"},{val:warns+dangers,lbl:"Attention",c:"#f39c12"},{val:dangers,lbl:"Injury",c:"#e74c3c"}].map(s=>(
          <div key={s.lbl} style={{ background:"#1c2128",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"14px 10px",textAlign:"center" }}>
            <div style={{ fontSize:24,fontWeight:700,color:s.c }}>{s.val}</div>
            <div style={{ fontSize:10,color:"#484f58",marginTop:3 }}>{s.lbl}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{ display:"flex",gap:2,background:"#21262d",borderRadius:8,padding:3,marginBottom:16 }}>
        {["athletes","plans","alerts"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{ flex:1,padding:8,fontSize:12,fontWeight:600,border:"none",background:tab===t?"#1c2128":"transparent",color:tab===t?"#e6edf3":"#8b949e",cursor:"pointer",borderRadius:6,textTransform:"capitalize" }}>{t}</button>
        ))}
      </div>

      {tab==="athletes" && (
        <div>
          <div style={{ display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:14 }}>
            {["all","danger","warn","ok"].map(f=>(
              <button key={f} onClick={()=>setFilter(f)} style={{ padding:"6px 14px",borderRadius:20,border:`1px solid ${filter===f?"#c0392b":"rgba(255,255,255,0.08)"}`,background:filter===f?"#c0392b":"#1c2128",color:filter===f?"#fff":"#8b949e",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap" }}>
                {f==="all"?"All":f==="danger"?"Injury":f==="warn"?"Follow up":"Healthy"}
              </button>
            ))}
          </div>
          {filtered.length===0 ? (
            <div style={{ textAlign:"center",padding:40,color:"#484f58" }}>
              <div style={{ fontSize:36,marginBottom:10 }}>📋</div>
              <p style={{ fontSize:13 }}>No reports yet.</p>
            </div>
          ) : filtered.map((r,i)=>{
            const ini=r.runner_name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
            const col=colors[i%colors.length];
            const dotCol=r.status==="danger"?"#e74c3c":r.status==="warn"?"#f39c12":"#27ae60";
            const ago=Math.round((Date.now()-new Date(r.created_at))/60000);
            const agoStr=ago<60?`${ago}m ago`:ago<1440?`${Math.round(ago/60)}h ago`:`${Math.round(ago/1440)}d ago`;
            const rec=calcRecovery(r);
            return (
              <div key={r.runner_name} onClick={()=>setSelected(r)} style={{ background:"#1c2128",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,cursor:"pointer" }}>
                <div style={{ width:42,height:42,borderRadius:"50%",background:`${col}22`,color:col,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0 }}>{ini}</div>
                <div style={{ flex:1,minWidth:0 }}>
                  <div style={{ fontSize:14,fontWeight:700 }}>{r.runner_name}</div>
                  <div style={{ fontSize:12,color:"#8b949e",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{r.km}km · {r.sessions} sessions · Recovery: {rec}% · {agoStr}</div>
                  <div style={{ display:"flex",gap:5,marginTop:6,flexWrap:"wrap" }}>
                    {r.alerts ? r.alerts.split(",").map(a=>(
                      <span key={a} style={{ fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:20,background:r.status==="danger"?"rgba(231,76,60,0.15)":"rgba(243,156,18,0.15)",color:r.status==="danger"?"#e74c3c":"#f39c12" }}>{a.trim()}</span>
                    )) : <span style={{ fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:20,background:"rgba(39,174,96,0.15)",color:"#27ae60" }}>Healthy</span>}
                  </div>
                </div>
                <div style={{ width:8,height:8,borderRadius:"50%",background:dotCol,flexShrink:0 }} />
              </div>
            );
          })}

          {/* Detail modal */}
          {selected && (
            <div onClick={e=>e.target===e.currentTarget&&setSelected(null)} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"flex-end" }}>
              <div style={{ background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"14px 14px 0 0",width:"100%",maxHeight:"90vh",overflowY:"auto",padding:20 }}>
                <div style={{ width:32,height:3,background:"rgba(255,255,255,0.1)",borderRadius:2,margin:"0 auto 18px" }} />
                <div style={{ display:"flex",alignItems:"center",gap:12,marginBottom:18 }}>
                  <div style={{ width:46,height:46,borderRadius:"50%",background:"rgba(8,145,178,0.15)",color:"#0891b2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700 }}>
                    {selected.runner_name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}
                  </div>
                  <div>
                    <div style={{ fontSize:16,fontWeight:700 }}>{selected.runner_name}</div>
                    <div style={{ fontSize:12,color:"#8b949e" }}>{new Date(selected.created_at).toLocaleDateString("en-GB")} · Recovery: {calcRecovery(selected)}%</div>
                  </div>
                  <button onClick={()=>setSelected(null)} style={{ marginLeft:"auto",background:"#21262d",border:"none",color:"#8b949e",width:30,height:30,borderRadius:"50%",cursor:"pointer",fontSize:14 }}>✕</button>
                </div>

                {selected.pain==="Serious pain"&&<div style={{ background:"rgba(231,76,60,0.1)",border:"1px solid rgba(231,76,60,0.3)",borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:13,color:"#e74c3c" }}>⚠ Serious pain: {selected.pain_location||"unknown"}</div>}
                {selected.resting_hr>65&&<div style={{ background:"rgba(243,156,18,0.1)",border:"1px solid rgba(243,156,18,0.3)",borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:13,color:"#f39c12" }}>High resting HR: {selected.resting_hr} bpm</div>}

                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14 }}>
                  {[{l:"Weekly volume",v:`${selected.km} km`,c:"#27ae60"},{l:"Sessions",v:selected.sessions},{l:"Long run",v:`${selected.long_run||"—"} km`},{l:"Resting HR",v:`${selected.resting_hr||"—"} bpm`,c:selected.resting_hr>65?"#f39c12":null},{l:"Sleep",v:`${selected.sleep_quality||"—"}${selected.sleep_hrs?` / ${selected.sleep_hrs}h`:""}`},{l:"Motivation",v:`${selected.motivation||"—"}/5`,c:selected.motivation<=2?"#f39c12":null},{l:"Stress",v:selected.stress||"—"},{l:"Energy",v:selected.energy||"—"}].map(x=>(
                    <div key={x.l} style={{ background:"#21262d",borderRadius:8,padding:10 }}>
                      <div style={{ fontSize:10,color:"#484f58",marginBottom:3 }}>{x.l}</div>
                      <div style={{ fontSize:15,fontWeight:700,color:x.c||"#e6edf3" }}>{x.v}</div>
                    </div>
                  ))}
                </div>

                {(selected.pct_easy||selected.pct_mod||selected.pct_hard) && (
                  <div>
                    <div style={{ fontSize:10,fontWeight:700,color:"#484f58",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8 }}>Training distribution</div>
                    {[{l:"Easy",v:selected.pct_easy||0,c:"#27ae60"},{l:"Moderate",v:selected.pct_mod||0,c:"#f39c12"},{l:"Hard",v:selected.pct_hard||0,c:"#e74c3c"}].map(x=>(
                      <div key={x.l} style={{ marginBottom:10 }}>
                        <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5 }}><span>{x.l}</span><span style={{ color:x.c }}>{x.v}%</span></div>
                        <div style={{ height:5,background:"#21262d",borderRadius:3,overflow:"hidden" }}><div style={{ height:"100%",width:`${x.v}%`,background:x.c,borderRadius:3 }} /></div>
                      </div>
                    ))}
                  </div>
                )}

                {selected.notes && <div style={{ marginTop:8 }}><div style={{ fontSize:10,fontWeight:700,color:"#484f58",textTransform:"uppercase",marginBottom:6 }}>Notes</div><div style={{ fontSize:13,color:"#8b949e",background:"#21262d",borderRadius:8,padding:12,lineHeight:1.7 }}>{selected.notes}</div></div>}

                <hr style={{ border:"none",borderTop:"1px solid rgba(255,255,255,0.08)",margin:"16px 0" }} />
                <div style={{ fontSize:10,fontWeight:700,color:"#484f58",textTransform:"uppercase",marginBottom:10 }}>Chat with {selected.runner_name}</div>
                <div style={{ display:"flex",flexDirection:"column",gap:8,maxHeight:200,overflowY:"auto",marginBottom:12 }}>
                  {chatMsgs.length===0 ? <div style={{ color:"#484f58",fontSize:13,textAlign:"center",padding:16 }}>No messages yet.</div>
                  : chatMsgs.map(m=>(
                    <div key={m.id} style={{ display:"flex",flexDirection:"column",alignItems:m.from_coach?"flex-start":"flex-end" }}>
                      <div style={{ maxWidth:"80%",padding:"10px 14px",fontSize:13,lineHeight:1.5,background:m.from_coach?"#c0392b":"#21262d",color:"#fff",borderRadius:m.from_coach?"4px 14px 14px 14px":"14px 4px 14px 14px" }}>{m.message}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex",gap:8,alignItems:"flex-end" }}>
                  <textarea value={coachMsg} onChange={e=>setCoachMsg(e.target.value)} rows={1} placeholder={`Message ${selected.runner_name}...`}
                    style={{ flex:1,background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"10px 12px",fontSize:14,color:"#e6edf3",outline:"none",resize:"none" }} />
                  <button onClick={sendCoachMsg} style={{ width:40,height:40,borderRadius:"50%",background:"#c0392b",border:"none",color:"#fff",fontSize:18,cursor:"pointer",flexShrink:0 }}>➤</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {tab==="plans" && (
        <Card title="Write Training Plan">
          <Field label="Select Athlete">
            <select value={planRunner} onChange={e=>setPlanRunner(e.target.value)} style={{ width:"100%",background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"11px 13px",fontSize:14,color:"#e6edf3",outline:"none" }}>
              <option value="">-- Select athlete --</option>
              {reports.map(r=><option key={r.runner_name} value={r.runner_name}>{r.runner_name}</option>)}
            </select>
          </Field>
          <Field label="Week starting"><Input type="date" value={planWeek} onChange={setPlanWeek} /></Field>
          <Field label="Intensity">
            <Chips value={planIntensity} onChange={setPlanIntensity} options={[{label:"Recovery",color:"#27ae60"},{label:"Base"},{label:"Build",color:"#f39c12"},{label:"Peak",color:"#e74c3c"}]} />
          </Field>
          <Field label="Training Plan">
            <textarea value={planText} onChange={e=>setPlanText(e.target.value)} rows={8}
              placeholder={"Monday: Easy 8km @ Z2\nTuesday: Rest\nWednesday: Tempo 6km @ LT\nThursday: Easy 6km\nFriday: Rest\nSaturday: Long run 18km @ Z2\nSunday: Recovery 5km"}
              style={{ width:"100%",background:"#161b22",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"11px 13px",fontSize:13,color:"#e6edf3",outline:"none",resize:"none",lineHeight:1.7 }} />
          </Field>
          <Btn onClick={savePlan}>Save Plan</Btn>
        </Card>
      )}

      {tab==="alerts" && (
        <div>
          {reports.filter(r=>r.status!=="ok").length===0 ? (
            <div style={{ textAlign:"center",padding:40,color:"#484f58" }}><div style={{ fontSize:32,marginBottom:8 }}>✅</div><p style={{ fontSize:13 }}>No active alerts!</p></div>
          ) : reports.filter(r=>r.status!=="ok").map(r=>(
            <div key={r.runner_name} style={{ background:r.status==="danger"?"rgba(231,76,60,0.1)":"rgba(243,156,18,0.1)",border:`1px solid ${r.status==="danger"?"rgba(231,76,60,0.3)":"rgba(243,156,18,0.3)"}`,borderRadius:8,padding:"10px 12px",marginBottom:10,fontSize:13,color:r.status==="danger"?"#e74c3c":"#f39c12" }}>
              <strong>{r.runner_name}</strong> — {r.alerts}
              <div style={{ fontSize:11,marginTop:4,opacity:.7 }}>{new Date(r.created_at).toLocaleDateString("en-GB")}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──
function App() {
  const [page, setPage] = useState("runner");
  const [runnerState, setRunnerState] = useState("loading");
  const [runnerName, setRunnerName] = useState("");

  useEffect(() => {
    const saved = localStorage.getItem("ir_runner");
    if (saved) { setRunnerName(saved); setRunnerState("dashboard"); }
    else setRunnerState("onboard");
  }, []);

  return (
    <div style={{ background: "#0d1117", color: "#e6edf3", minHeight: "100vh", maxWidth: 480, margin: "0 auto", fontFamily: "system-ui,-apple-system,Arial,sans-serif" }}>
      {/* Nav */}
      <div style={{ position:"sticky",top:0,zIndex:100,background:"rgba(13,17,23,0.96)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54 }}>
        <img src={`data:image/png;base64,${LOGO}`} style={{ height:32,objectFit:"contain" }} alt="IranRunners" />
        <button onClick={()=>setPage(p=>p==="coach"?"runner":"coach")} style={{ padding:"6px 14px",borderRadius:20,fontSize:12,fontWeight:600,border:`1px solid ${page==="coach"?"#c0392b":"rgba(255,255,255,0.08)"}`,background:page==="coach"?"#c0392b":"transparent",color:page==="coach"?"#fff":"#8b949e",cursor:"pointer" }}>
          Coach
        </button>
      </div>

      {/* Pages */}
      <div style={{ padding:16, paddingBottom:90 }}>
        {page==="runner" && (
          runnerState==="loading" ? <div style={{ textAlign:"center",padding:60,color:"#484f58" }}>Loading...</div>
          : runnerState==="onboard" ? <Onboard onSetup={()=>setRunnerState("setup")} onLogin={()=>setRunnerState("login")} />
          : runnerState==="setup" ? <Setup onSave={n=>{setRunnerName(n);setRunnerState("dashboard");}} />
          : runnerState==="login" ? <Login onLogin={n=>{localStorage.setItem("ir_runner",n);setRunnerName(n);setRunnerState("dashboard");}} />
          : <RunnerDashboard runnerName={runnerName} />
        )}
        {page==="coach" && <CoachPanel />}
      </div>

      {/* Bottom nav */}
      <div style={{ position:"fixed",bottom:0,left:0,right:0,maxWidth:480,margin:"0 auto",background:"rgba(13,17,23,0.96)",backdropFilter:"blur(16px)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",paddingBottom:"calc(8px + env(safe-area-inset-bottom))",paddingTop:8,zIndex:100 }}>
        {[{id:"runner",icon:"🏃",label:"Runner"},{id:"coach",icon:"📊",label:"Coach"}].map(b=>(
          <button key={b.id} onClick={()=>setPage(b.id)} style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:6,color:page===b.id?"#c0392b":"#484f58",fontSize:10,fontWeight:500 }}>
            <span style={{ fontSize:20 }}>{b.icon}</span>
            <span>{b.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
