// ── DB ──
async function db(table, method="GET", data=null, filter="") {
  try {
    const url = SUPA_URL+"/rest/v1/"+table+filter;
    const h = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", Accept:"application/json", Prefer: method==="POST"?"return=representation":""};
    const opts = {method, headers:h};
    if(data) opts.body = JSON.stringify(data);
    const res = await fetch(url, opts);
    if(!res.ok) { console.error("DB",res.status,await res.text()); return null; }
    return await res.json();
  } catch(e) { console.error("DB",e); return null; }
}

async function dbUpdate(table, data, filter) {
  try {
    const url = SUPA_URL+"/rest/v1/"+table+filter;
    const h = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", Accept:"application/json", Prefer:"return=representation"};
    const res = await fetch(url, {method:"PATCH", headers:h, body:JSON.stringify(data)});
    if(!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

// ── UTILS ──
function secToTime(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`:`${m}:${String(sec).padStart(2,"0")}`; }
function paceToSec(p) { const parts=String(p).split(":"); return parts.length===2?parseInt(parts[0])*60+parseInt(parts[1]):parseFloat(p)*60; }
function secToPace(s) { const m=Math.floor(s/60),sec=Math.round(s%60); return m+":"+String(sec).padStart(2,"0"); }
function calcVo2(tempo) { if(!tempo||tempo<=0) return 0; const spd=60/tempo; return Math.round((-4.60+0.182258*spd+0.000104*spd*spd)/0.8); }
function calcRecovery(r) { let s=70; if(r.resting_hr>65)s-=15; if(r.motivation<=2)s-=10; if(r.sleep_hrs<6&&r.sleep_hrs>0)s-=15; if(r.pain==="Serious pain")s-=20; if(r.recovery==="Fast")s+=15; if(r.sleep_quality==="Excellent")s+=10; return Math.max(10,Math.min(100,s)); }

    setLoading(true); setErr("");
    if(mode==="signup") {
      const existing = await db("users","GET",null,"?email=eq."+encodeURIComponent(email)+"&limit=1");
      if(existing&&existing.length>0){setErr("Email already registered");setLoading(false);return;}

function StrategyTab() {

  const calcRaceStrategy = () => {
    const d=parseFloat(dist); const t=paceToSec(targetTime);
    if(!d||!t){return;}
    const avgPaceSec=t/d; const splits=[];
    const interval=parseFloat(customSplit)||5;
    let km=0;
    while(km<d) {
      const segEnd=Math.min(km+interval,d); const segDist=segEnd-km;
      let segPace=avgPaceSec;
      if(strategy==="negative"){segPace=km<d/2?avgPaceSec*1.03:avgPaceSec*0.97;}
      else if(strategy==="positive"){segPace=km<d/2?avgPaceSec*0.97:avgPaceSec*1.03;}
      else if(strategy==="fast-start"){segPace=km<5?avgPaceSec*0.95:avgPaceSec*1.01;}
      splits.push({from:km,to:segEnd,dist:segDist,pace:segPace,time:segPace*segDist});
      km=segEnd;
    }
    const zones=[
      {name:"Z1 Easy",pct:0.65,pace:avgPaceSec*1.4},
      {name:"Z2 Aerobic",pct:0.72,pace:avgPaceSec*1.2},
      {name:"Z3 Tempo",pct:0.82,pace:avgPaceSec*1.05},
      {name:"Z4 Threshold",pct:0.89,pace:avgPaceSec*0.98},
      {name:"Z5 VO2max",pct:0.95,pace:avgPaceSec*0.9},
    ];
    setResult({splits,avgPace:avgPaceSec,totalTime:t,zones,dist:d});
  };

          React.createElement(Fld,{label:"Target time (mm:ss or h:mm:ss)"},React.createElement(Inp,{placeholder:"3:45:00",value:targetTime,onChange:setTargetTime}))),

        React.createElement(Fld,{label:"Split every (km)"},React.createElement(Inp,{type:"number",placeholder:"5",value:customSplit,onChange:setCustomSplit,min:"1",max:"10"})),
        React.createElement(Btn,{onClick:calcRaceStrategy},"Calculate Strategy")),
      result&&React.createElement("div",null,

          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4,marginBottom:8}},
            ["From","To","Pace","Time"].map(h=>React.createElement("div",{key:h,style:{fontSize:10,fontWeight:700,color:C.text3}},h))),
          result.splits.map((s,i)=>React.createElement("div",{key:i,style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderTop:"1px solid "+C.border}},
            React.createElement("div",{style:{fontSize:12,color:C.text2}},s.from+"km"),
            React.createElement("div",{style:{fontSize:12,color:C.text2}},s.to.toFixed(1)+"km"),
            React.createElement("div",{style:{fontSize:12,fontWeight:600,color:C.accent}},secToPace(s.pace)+"/km"),
